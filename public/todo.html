<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 할 일</title>
<meta name="theme-color" content="#1f5f8b">
<meta name="description" content="메일 정리에서 뽑은 내 할 일, 직접 온 메일, 메모">
<link rel="manifest" href="/todo.webmanifest">
<link rel="icon" href="/app/todo-icon-192.png">
<link rel="apple-touch-icon" href="/app/todo-icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app bar → notification banner → one list per tab → fixed bottom tab bar */
:root{
  --bg:#f3f5f7; --panel:#fff; --ink:#18212b; --muted:#5d6b78; --line:#dde3e9; --soft:#eef2f5;
  --accent:#1f5f8b; --accent-ink:#fff; --red:#c8372d; --red-bg:#fdecea; --amber:#b7791f; --amber-bg:#fdf3e1; --green:#2f7d4f; --green-bg:#e6f4ec;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161c; --panel:#192029; --ink:#e4e9ee; --muted:#93a1ae; --line:#2a3440; --soft:#1f2832;
  --accent:#5fa8d8; --accent-ink:#0d1620; --red:#ef6b60; --red-bg:#3a1d1b; --amber:#e0a84a; --amber-bg:#352a17; --green:#5cc08a; --green-bg:#18301f;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.bar h1{font-size:18px;margin:0;font-weight:700}
.bar .sub{font-size:12px;opacity:.85}
.bar .grow{flex:1;min-width:0}
.bar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
main{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:180px;font-size:14px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--red);border-color:var(--red)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:13px;color:var(--muted);font-weight:600;margin:18px 4px 8px;letter-spacing:.02em}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.card.done{opacity:.55}
.card.done .t{text-decoration:line-through}
.chk{appearance:none;flex:0 0 auto;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;margin:1px 0 0;display:grid;place-items:center;background:var(--panel)}
.chk:checked{background:var(--green);border-color:var(--green)}
.chk:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.m{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.m a{color:var(--accent)}
.d{font-size:13.5px;margin-top:4px;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap}
.pill{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px}
.p-red{background:var(--red-bg);color:var(--red)} .p-amber{background:var(--amber-bg);color:var(--amber)} .p-green{background:var(--green-bg);color:var(--green)}
.due{font-family:var(--f-mono);font-size:12px} .due.over{color:var(--red);font-weight:600}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--muted)}
details.fold>summary{cursor:pointer;color:var(--muted);font-size:13px;margin:16px 4px 8px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
.compose{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.compose textarea,.edit textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
.row .grow{flex:1}
.icon{background:none;border:0;color:var(--muted);padding:2px 4px;font-size:18px;line-height:1}
.icon.on{color:var(--amber)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500;position:relative}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.tabs .n{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10.5px;min-width:18px;padding:0 5px;line-height:18px;text-align:center;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;z-index:20;max-width:90vw}
</style>
</head>
<body>
<header class="bar">
  <div class="grow"><h1 id="title">내 할 일</h1><div class="sub" id="stamp">불러오는 중…</div></div>
  <button id="refresh" aria-label="새로고침">새로고침</button>
</header>

<main>
  <div class="banner" id="pushBanner" hidden>
    <p id="pushText">새 할 일이나 나한테 직접 온 메일이 생기면 알림을 받을 수 있어요.</p>
    <button class="btn primary" id="pushOn">알림 켜기</button>
  </div>
  <div class="banner" id="installBanner" hidden>
    <p>크롬 메뉴(⋮)에서 <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르면 앱처럼 쓸 수 있어요.</p>
    <button class="btn" id="installBtn" hidden>설치</button>
  </div>

  <section id="v-todos"></section>
  <section id="v-direct" hidden></section>
  <section id="v-memos" hidden></section>
</main>

<nav class="tabs" aria-label="보기">
  <a href="#todos" data-v="todos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>할 일<span class="n" id="n-todos" hidden></span></a>
  <a href="#direct" data-v="direct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>직접 온 메일<span class="n" id="n-direct" hidden></span></a>
  <a href="#memos" data-v="memos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>메모</a>
</nav>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { todos:[], direct:[], memos:[], state:{}, lastRunAt:null, exportedAt:null, view:"todos", loaded:false, err:false, editing:null, confirmDel:null };

const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const dday = s => s ? Math.round((new Date(s+"T00:00:00") - today())/864e5) : null;
const dueTxt = s => { const n=dday(s); if(n==null) return ""; const l=n===0?"오늘":n>0?"D-"+n:"D+"+(-n); return `<span class="due ${n<0?"over":""}">${esc(s.slice(5).replace("-","/"))} ${l}</span>`; };
const fmt = iso => iso ? new Date(iso).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}) : "";
const ago = iso => { if(!iso) return ""; const m=(Date.now()-new Date(iso))/6e4; if(m<60) return Math.max(1,Math.round(m))+"분 전"; if(m<1440) return Math.round(m/60)+"시간 전"; return Math.round(m/1440)+"일 전"; };
const outlook = mid => "https://outlook.office365.com/owa/?ItemID="+encodeURIComponent(mid)+"&exvsurl=1&viewmodel=ReadMessageItem";
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
async function api(path, opts={}){ const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||("오류 "+r.status)); return j; }

const isDone = (kind,id) => !!S.state[kind+":"+id];
const openTodos = () => S.todos.filter(t=>t.status!=="closed");

/* ---------- render ---------- */
function render(){
  $("#stamp").textContent = S.err ? "불러오지 못했어요. 새로고침을 눌러 보세요." : S.lastRunAt ? `메일 정리 ${fmt(S.lastRunAt)} · ${ago(S.lastRunAt)}` : (S.loaded ? "아직 정리 결과가 없어요" : "불러오는 중…");
  const nT=openTodos().filter(t=>!isDone("todo",t.id)).length, nD=S.direct.filter(d=>!isDone("direct",d.id)).length;
  $("#n-todos").hidden=!nT; $("#n-todos").textContent=nT;
  $("#n-direct").hidden=!nD; $("#n-direct").textContent=nD;
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===S.view?"page":"false"));
  ["todos","direct","memos"].forEach(v=>$("#v-"+v).hidden = v!==S.view);
  $("#title").textContent = {todos:"내 할 일",direct:"직접 온 메일",memos:"메모"}[S.view];
  ({todos:renderTodos, direct:renderDirect, memos:renderMemos})[S.view]();
}
const loading = () => `<div class="empty">${S.err?"데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.":"불러오는 중…"}</div>`;

function todoCard(t){
  const done=isDone("todo",t.id);
  const urgent = t.priority==="high" || (dday(t.due)!=null && dday(t.due)<=1);
  return `<div class="card ${done?"done":""}">
    <input type="checkbox" class="chk" data-kind="todo" data-id="${esc(t.id)}" ${done?"checked":""} aria-label="완료 표시">
    <div class="body">
      <div class="t">${esc(t.text)}</div>
      <div class="m">${urgent&&!done?'<span class="pill p-red">급함</span>':""}${dueTxt(t.due)}${t.from?`<span>${esc(t.from)}</span>`:""}${t.mid?`<a href="${esc(outlook(t.mid))}" target="_blank" rel="noopener">메일 열기</a>`:""}</div>
      ${t.detail?`<div class="d">${esc(t.detail)}</div>`:""}
    </div></div>`;
}
function renderTodos(){
  if(!S.loaded||S.err){ $("#v-todos").innerHTML=loading(); return; }
  const list=openTodos().slice().sort((a,b)=>{ const pa=a.priority==="high"?0:1, pb=b.priority==="high"?0:1; return pa-pb || ((dday(a.due)??999)-(dday(b.due)??999)) || String(b.createdAt||"").localeCompare(String(a.createdAt||"")); });
  const open=list.filter(t=>!isDone("todo",t.id)), done=list.filter(t=>isDone("todo",t.id));
  const memoTodos=S.memos.filter(m=>!m.done && m.due);
  let h = open.length ? `<div class="list">${open.map(todoCard).join("")}</div>` : `<div class="empty">메일에서 찾은 할 일을 모두 끝냈어요.</div>`;
  if(memoTodos.length) h += `<h2>내 메모 중 기한 있는 것</h2><div class="list">${memoTodos.map(memoCard).join("")}</div>`;
  if(done.length) h += `<details class="fold"><summary>완료한 일 ${done.length}개 ▾</summary><div class="list">${done.map(todoCard).join("")}</div></details>`;
  $("#v-todos").innerHTML = `<h2>메일에서 찾은 내 할 일 ${open.length}개</h2>` + h;
}

function directCard(d){
  const seen=isDone("direct",d.id);
  return `<div class="card ${seen?"done":""}">
    <input type="checkbox" class="chk" data-kind="direct" data-id="${esc(d.id)}" ${seen?"checked":""} aria-label="확인 표시">
    <div class="body">
      <div class="t">${esc(d.subject||d.gist)}</div>
      <div class="m"><span>${esc(d.from)}</span><span>${esc(fmt(d.at))}</span>${d.needsReply&&!seen?'<span class="pill p-amber">회신 필요</span>':""}${d.mid?`<a href="${esc(outlook(d.mid))}" target="_blank" rel="noopener">메일 열기</a>`:""}</div>
      ${d.gist?`<div class="d">${esc(d.gist)}</div>`:""}
    </div></div>`;
}
function renderDirect(){
  if(!S.loaded||S.err){ $("#v-direct").innerHTML=loading(); return; }
  const list=S.direct.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const unseen=list.filter(d=>!isDone("direct",d.id)), seen=list.filter(d=>isDone("direct",d.id));
  let h = unseen.length ? `<div class="list">${unseen.map(directCard).join("")}</div>` : `<div class="empty">확인 안 한 직접 메일이 없어요.</div>`;
  if(seen.length) h += `<details class="fold"><summary>확인한 메일 ${seen.length}통 ▾</summary><div class="list">${seen.map(directCard).join("")}</div></details>`;
  $("#v-direct").innerHTML = `<h2>나에게 직접(받는 사람) 온 메일 · 확인 안 함 ${unseen.length}통</h2>` + h;
}

function memoCard(m){
  if(S.editing===m.id) return `<div class="card edit" style="flex-direction:column;align-items:stretch">
    <textarea id="editBody" aria-label="메모 수정">${esc(m.body)}</textarea>
    <div class="row"><input type="date" id="editDue" value="${esc(m.due||"")}" aria-label="기한"><span class="grow"></span><button class="btn small" data-act="cancelEdit">취소</button><button class="btn small primary" data-act="saveEdit" data-id="${m.id}">저장</button></div></div>`;
  return `<div class="card ${m.done?"done":""}">
    <input type="checkbox" class="chk" data-memo="${m.id}" ${m.done?"checked":""} aria-label="완료 표시">
    <div class="body" data-act="edit" data-id="${m.id}" style="cursor:text">
      <div class="t" style="font-weight:500;white-space:pre-wrap">${esc(m.body)}</div>
      <div class="m">${dueTxt(m.due)}<span>${esc(ago(m.updated_at))}</span></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <button class="icon ${m.pinned?"on":""}" data-act="pin" data-id="${m.id}" aria-label="${m.pinned?"고정 해제":"위에 고정"}">${m.pinned?"★":"☆"}</button>
      ${S.confirmDel===m.id?`<button class="btn small danger" data-act="del" data-id="${m.id}">삭제</button><button class="btn small" data-act="cancelDel">취소</button>`:`<button class="icon" data-act="askDel" data-id="${m.id}" aria-label="삭제">🗑</button>`}
    </div></div>`;
}
function renderMemos(){
  const draft = (()=>{ try{ return localStorage.getItem("memoDraft")||""; }catch{ return ""; } })();
  const keepBody = $("#newBody") ? $("#newBody").value : draft;
  const keepDue = $("#newDue") ? $("#newDue").value : "";
  const open=S.memos.filter(m=>!m.done), done=S.memos.filter(m=>m.done);
  $("#v-memos").innerHTML = `<form class="compose" id="memoForm">
      <textarea id="newBody" placeholder="필요한 것, 챙길 일, 아이디어를 적어 두세요" aria-label="새 메모">${esc(keepBody)}</textarea>
      <div class="row"><input type="date" id="newDue" value="${esc(keepDue)}" aria-label="기한 (선택)"><span class="note" style="font-size:12px;color:var(--muted)">기한을 넣으면 할 일 탭에도 보여요</span><span class="grow"></span><button class="btn primary" type="submit">추가</button></div>
    </form>
    ${!S.loaded||S.err?loading():""}
    ${S.loaded&&!S.err?(open.length?`<h2>메모 ${open.length}개</h2><div class="list">${open.map(memoCard).join("")}</div>`:`<div class="empty" style="margin-top:12px">아직 메모가 없어요. 위에 적고 추가를 누르세요.</div>`):""}
    ${done.length?`<details class="fold"><summary>완료한 메모 ${done.length}개 ▾</summary><div class="list">${done.map(memoCard).join("")}</div></details>`:""}`;
  if(S.editing){ const t=$("#editBody"); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } }
}

/* ---------- data ---------- */
async function load(){
  try{ const d=await api("/api/my/data",{cache:"no-store"}); Object.assign(S,{todos:d.todos||[],direct:d.direct||[],memos:d.memos||[],state:d.state||{},lastRunAt:d.lastRunAt,exportedAt:d.exportedAt,err:false}); }
  catch(e){ S.err=true; }
  S.loaded=true; render();
}
async function reloadMemos(){ try{ S.memos=(await api("/api/my/memos")).memos; }catch(e){ toast(e.message); } render(); }

document.addEventListener("change", async e=>{
  const c=e.target;
  if(c.dataset.kind){ const key=c.dataset.kind+":"+c.dataset.id; const v=c.checked; S.state[key]=v; render();
    try{ await api("/api/my/state",{method:"PUT",body:JSON.stringify({key,done:v})}); }catch(err){ S.state[key]=!v; render(); toast("저장하지 못했어요: "+err.message); } }
  if(c.dataset.memo){ const id=Number(c.dataset.memo); const m=S.memos.find(x=>x.id===id); m.done=c.checked; render();
    try{ await api("/api/my/memos/"+id,{method:"PATCH",body:JSON.stringify({done:c.checked})}); reloadMemos(); }catch(err){ toast("저장하지 못했어요: "+err.message); reloadMemos(); } }
});
document.addEventListener("input", e=>{ if(e.target.id==="newBody"){ try{ localStorage.setItem("memoDraft", e.target.value); }catch{} } });
document.addEventListener("submit", async e=>{
  if(e.target.id!=="memoForm") return; e.preventDefault();
  const body=$("#newBody").value.trim(), due=$("#newDue").value;
  if(!body){ toast("메모 내용을 적어 주세요"); return; }
  try{ await api("/api/my/memos",{method:"POST",body:JSON.stringify({body,due:due||null})}); $("#newBody").value=""; $("#newDue").value=""; try{ localStorage.removeItem("memoDraft"); }catch{} toast("메모를 추가했어요"); reloadMemos(); }
  catch(err){ toast("추가하지 못했어요: "+err.message); }
});
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const id=Number(t.dataset.id), act=t.dataset.act;
  if(act==="edit"){ S.editing=id; render(); }
  else if(act==="cancelEdit"){ S.editing=null; render(); }
  else if(act==="saveEdit"){ const body=$("#editBody").value.trim(); if(!body){ toast("내용이 비어 있어요"); return; }
    try{ await api("/api/my/memos/"+id,{method:"PATCH",body:JSON.stringify({body,due:$("#editDue").value||null})}); S.editing=null; reloadMemos(); }catch(err){ toast("저장하지 못했어요: "+err.message); } }
  else if(act==="pin"){ const m=S.memos.find(x=>x.id===id); try{ await api("/api/my/memos/"+id,{method:"PATCH",body:JSON.stringify({pinned:!m.pinned})}); reloadMemos(); }catch(err){ toast(err.message); } }
  else if(act==="askDel"){ S.confirmDel=id; render(); }
  else if(act==="cancelDel"){ S.confirmDel=null; render(); }
  else if(act==="del"){ try{ await api("/api/my/memos/"+id,{method:"DELETE"}); S.confirmDel=null; toast("삭제했어요"); reloadMemos(); }catch(err){ toast(err.message); } }
});
function route(){ const h=location.hash.slice(1); S.view=["todos","direct","memos"].includes(h)?h:"todos"; S.editing=null; S.confirmDel=null; render(); }
window.addEventListener("hashchange", route);
$("#refresh").addEventListener("click", ()=>{ S.loaded=false; render(); load(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") load(); });

/* ---------- push ---------- */
const b64ToBytes = b => { const p="=".repeat((4-b.length%4)%4); const s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s, c=>c.charCodeAt(0)); };
let reg=null;
async function setupPush(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) { $("#pushBanner").hidden=false; $("#pushText").textContent="이 브라우저는 알림을 지원하지 않아요. 안드로이드 크롬에서 열어 주세요."; $("#pushOn").hidden=true; return; }
  reg = await navigator.serviceWorker.register("/sw.js",{scope:"/",updateViaCache:"none"});
  navigator.serviceWorker.addEventListener("message", ev=>{ if(ev.data&&ev.data.type==="open"){ const u=new URL(ev.data.url); location.hash=u.hash||"#todos"; load(); } });
  const sub = await reg.pushManager.getSubscription();
  if(sub && Notification.permission==="granted"){ api("/api/my/push",{method:"POST",body:JSON.stringify(sub.toJSON())}).catch(()=>{}); return; }
  $("#pushBanner").hidden=false;
  if(Notification.permission==="denied"){ $("#pushText").textContent="알림이 차단돼 있어요. 크롬 사이트 설정에서 이 사이트의 알림을 허용해 주세요."; $("#pushOn").hidden=true; }
}
$("#pushOn").addEventListener("click", async ()=>{
  try{
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ toast("알림을 허용하지 않았어요"); return; }
    const { publicKey } = await api("/api/my/push");
    const r = reg || await navigator.serviceWorker.ready;
    const sub = await r.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(publicKey) });
    await api("/api/my/push",{method:"POST",body:JSON.stringify({...sub.toJSON(), test:true})});
    $("#pushBanner").hidden=true; toast("알림을 켰어요. 확인 알림을 보냈어요.");
  }catch(err){ toast("알림을 켜지 못했어요: "+err.message); }
});

/* ---------- install ---------- */
let deferred=null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if(!standalone){ $("#installBanner").hidden=false; }
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred=e; $("#installBtn").hidden=false; });
$("#installBtn").addEventListener("click", async ()=>{ if(!deferred) return; deferred.prompt(); const r=await deferred.userChoice; deferred=null; if(r.outcome==="accepted") $("#installBanner").hidden=true; });
window.addEventListener("appinstalled", ()=>{ $("#installBanner").hidden=true; });

route(); load(); setupPush().catch(()=>{});
})();
</script>

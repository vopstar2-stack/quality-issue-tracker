<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mail-dashboard-source" content="/api/mail-dashboard">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>클비서 메일 상황판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 바 → 답장 대기 → 숫자 4개 → 탭 보기. 조용한 청회색 바탕 + 상태색만 또렷하게(처리=빨강, 지켜봄=호박, 완료=초록) */
:root{
  --bg:#f1f4f7; --panel:#ffffff; --ink:#16202a; --muted:#5f6c79; --line:#e3e8ee; --soft:#f3f6f9; --line-strong:#cfd7e0;
  --accent:#1d5d8a; --accent-ink:#ffffff; --accent-soft:#e6eff6;
  --red:#c3362c; --red-bg:#fcebe9; --amber:#a8701a; --amber-bg:#fbf1df; --grey:#7a8794; --grey-bg:#edf0f3; --green:#2b7a4b; --green-bg:#e4f3ea;
  --shadow:0 1px 2px rgba(22,32,42,.05),0 2px 8px rgba(22,32,42,.04);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#171e26; --ink:#e3e8ee; --muted:#93a0ad; --line:#252f3a; --soft:#1c242d; --line-strong:#34404c;
  --accent:#62a9d9; --accent-ink:#0c151e; --accent-soft:#1a2c3b;
  --red:#ef6b60; --red-bg:#3a1d1b; --amber:#e0a84a; --amber-bg:#352a17; --grey:#93a1ae; --grey-bg:#232c36; --green:#5cc08a; --green-bg:#18301f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#171e26; --ink:#e3e8ee; --muted:#93a0ad; --line:#252f3a; --soft:#1c242d; --line-strong:#34404c;
  --accent:#62a9d9; --accent-ink:#0c151e; --accent-soft:#1a2c3b;
  --red:#ef6b60; --red-bg:#3a1d1b; --amber:#e0a84a; --amber-bg:#352a17; --grey:#93a1ae; --grey-bg:#232c36; --green:#5cc08a; --green-bg:#18301f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding-block:8px}
header.top .stamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header.top h1{white-space:nowrap}
#homeLink{color:var(--muted);text-decoration:none;font-size:18px;line-height:1;padding:4px 2px}
#refreshBtn{padding:4px 9px;font-size:16px;line-height:1.2;flex:none}
@media (max-width:520px){header.top h1 .pre{display:none} h1{font-size:16px}}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stamp b{color:var(--ink);font-weight:500}
.spacer{flex:1}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[disabled]{opacity:.5;cursor:default}
.brief{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow)}
.brief h2{margin:0;font-size:15px;font-weight:600;text-wrap:balance}
.brief li::marker{color:var(--muted)}
/* 답장 대기: 내가 답해야 하는데 아직 안 보낸 메일 */
.reply{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.reply h2{margin:0;font-size:13px;font-weight:600;padding:10px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--soft)}
.reply h2 .n{font-family:var(--f-mono);color:var(--red)}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--soft)}
.rrow .age{font-family:var(--f-mono);font-size:12px;font-weight:500;border-radius:5px;padding:1px 7px;background:var(--grey-bg);color:var(--grey);font-variant-numeric:tabular-nums}
.rrow .age.warn{background:var(--amber-bg);color:var(--amber)} .rrow .age.late{background:var(--red-bg);color:var(--red)}
.rrow .w{min-width:0;overflow-wrap:anywhere} .rrow .w b{font-weight:600} .rrow .w .s{display:block;font-size:12px;color:var(--muted)}
.rrow .from{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.rrow{grid-template-columns:auto minmax(0,1fr)} .rrow .from{grid-column:2}}
.brief .briefTop{display:flex;align-items:baseline;gap:12px;flex-wrap:nowrap;margin-bottom:6px}
.brief .briefTop h2{flex:1;min-width:0}
.brief .logLink{flex-shrink:0;font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap;font-weight:500}
.brief .logLink:hover{text-decoration:underline}
/* 브리핑: 항목마다 굵은 제목 한 줄 + 회색 설명 (접지 않고 전부 보인다 — 사용자 요청) */
.brief ul{margin:0;padding:0;list-style:none}
.brief li{padding:7px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline}
.brief li:first-child{border-top:0}
.brief .bt{grid-column:1/-1;font-weight:600;font-size:14px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.brief .bd{grid-column:1/-1;font-size:12.5px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.brief .bmore{margin-top:4px;font-size:12px;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
/* KPI: 한 줄짜리 작은 칩 */
.kpis{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 12px 4px 10px;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.kpi:hover{color:inherit;border-color:var(--accent)}
.kpi .n{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi.r .n{color:var(--red)} .kpi.a .n{color:var(--amber)} .kpi.b .n{color:var(--accent)}
.kpi .n.zero{color:var(--muted)!important;opacity:.6}
nav.tabs{display:flex;gap:2px;margin-top:18px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:6px 10px;color:var(--muted);text-decoration:none;border-radius:7px;white-space:nowrap;font-weight:500;font-size:13px}
nav.tabs a:hover{color:var(--ink);background:var(--soft)}
nav.tabs a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav.tabs .cnt{font-family:var(--f-mono);font-size:11px;background:var(--soft);color:var(--muted);border-radius:9px;padding:0 6px;margin-left:5px}
nav.tabs a[aria-current="page"] .cnt{background:rgba(255,255,255,.22);color:inherit}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.chip{border-radius:14px;padding:3px 11px;font-size:12px;border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.filters input{flex:1;min-width:160px;font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line-strong);border-radius:12px}
.note{font-size:12px;color:var(--muted)}
/* issue cards */
.list{display:flex;flex-direction:column;gap:8px}
.issue{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;box-shadow:var(--shadow)}
.issue[open]{border-color:var(--line-strong)}
.ititle::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grey);margin-right:8px;vertical-align:2px}
.issue.red .ititle::before{background:var(--red)} .issue.yellow .ititle::before{background:var(--amber)}
.issue.focus{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.issue.focus{transition:box-shadow .3s}}
.issue>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:5px 12px}
.issue>summary::-webkit-details-marker{display:none}
.ititle{font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.imeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.inext{grid-column:1/-1;font-size:13px}
.inext b{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.p-red{background:var(--red-bg);color:var(--red)} .p-yellow{background:var(--amber-bg);color:var(--amber)} .p-white{background:var(--grey-bg);color:var(--grey)}
.p-new{background:var(--accent);color:var(--accent-ink)} .p-proj{background:var(--soft);color:var(--muted)} .p-done{background:var(--green-bg);color:var(--green)}
.due{font-family:var(--f-mono)} .due.over{color:var(--red);font-weight:600}
.ibody{padding:0 16px 14px;border-top:1px solid var(--line)}
.inext{background:var(--soft);border-radius:7px;padding:5px 10px}
.p-reply{background:var(--red);color:#fff}
/* RMA 진행 보드 */
.rma{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.rma .col h3 small{font-weight:400;color:var(--muted)}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer;box-shadow:var(--shadow)}
.rcard:hover{border-color:var(--accent)}
.rcard.stale{border-color:var(--red)}
.rcard .code{display:block}
.rcard .m{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:2px}
.rcard .age{font-family:var(--f-mono)} .rcard.stale .age{color:var(--red);font-weight:600}
.rsteps{display:flex;gap:3px;margin-top:6px}
.rsteps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.rsteps i.on{background:var(--accent)}
.ysec{font-size:14px;margin:20px 0 6px;display:flex;gap:8px;align-items:baseline}
/* 품질회의 */
.qhead{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline}
.qhead .big{font-size:17px;font-weight:600}
.qhead .big .code{font-size:15px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
@media (max-width:860px){.qgrid{grid-template-columns:1fr}}
.qgrid div{background:var(--soft);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.qgrid b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.qsteps{display:flex;gap:3px;width:120px}
.qsteps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.qsteps i.on{background:var(--accent)}
.qasks{margin:8px 0;padding:0;list-style:none}
.qasks li{font-size:13px;padding:3px 0}
.qbtn{padding:1px 8px;font-size:11.5px;margin-left:4px}
.qasks .ok{color:var(--green);font-weight:600} .qasks .wait{color:var(--red);font-weight:600}
.issue.grey .ititle::before{background:var(--line-strong)}
.ibody p{margin:10px 0}
.thread{margin:8px 0 0;padding:0;list-style:none;border-left:2px solid var(--line)}
.thread li{padding:4px 0 6px 12px;position:relative}
.thread li::before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.thread .who{font-weight:600} .thread .when{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:6px}
.thread .gist{color:var(--ink)}
.thread a{color:var(--accent);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* signal view */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.lanes{grid-template-columns:1fr}}
.lane h3{margin:0 0 8px;font-size:13px;display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.row{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:6px;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.row:hover{border-color:var(--accent)}
.row .t{font-weight:600;font-size:13px;overflow-wrap:anywhere} .row .s{font-size:12px;color:var(--muted)}
/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--grey-bg);border-radius:12px;padding:8px;min-width:0}
.col h3{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;box-shadow:var(--shadow)}
.ask.stale{border-color:var(--red)}
.ask .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.ask .m{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.ask .age{font-family:var(--f-mono)} .ask.stale .age{color:var(--red);font-weight:600}
.ask .actions button{padding:2px 8px;font-size:12px}
/* log */
.log .entry{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.log .entry .stamp{display:block;margin-bottom:4px}
/* trace */
.tmodes{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:860px){.tgrid{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table.tt{border-collapse:collapse;width:100%;font-size:13px}
.tt th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.tt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tt tr.sel td{background:var(--soft)}
.tt tr[data-key]{cursor:pointer}
.tt tr[data-key]:hover td{background:var(--soft)}
.code{font-family:var(--f-mono);font-size:12.5px;font-weight:500;overflow-wrap:anywhere}
.code.sn1{white-space:nowrap;overflow-wrap:normal}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.grp .tbl-wrap{box-shadow:none}
.grp>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.grp>summary::-webkit-details-marker{display:none}
.grp .gt{font-weight:600}
.grp .tbl-wrap{border:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.detail h3{margin:0;font-family:var(--f-mono);font-size:16px;overflow-wrap:anywhere}
.attrs{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:8px 0}
.attrs dt{color:var(--muted)} .attrs dd{margin:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:3px 0 8px 14px}
.tl li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--grey)}
.tl li.ev-fail::before{border-color:var(--red);background:var(--red)}
.tl li.ev-swap::before{border-color:var(--amber)}
.tl li.ev-ok::before{border-color:var(--green)}
.tl .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:6px}
.tl .ty{font-size:11px;font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tchip{font-family:var(--f-mono);font-size:11.5px;border-radius:4px;padding:1px 7px;background:var(--soft);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.tchip.bad{border-color:var(--red);color:var(--red)}
/* defect registers (수입검사 불량 / 필드 불량) */
.dbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.dstat{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.dstat b{font-family:var(--f-mono);color:var(--ink)} .dstat .bad b{color:var(--red)}
.ok-mark{color:var(--green);font-weight:600} .no-mark{color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.dgrid .wide{grid-column:1/-1}
@media (max-width:560px){.dgrid{grid-template-columns:1fr}}
.dsec{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
#dlgDef textarea{min-height:64px}
#dlgDef{width:min(760px,calc(100vw - 32px))}
.snwarn{grid-column:1/-1;font-size:12px;color:var(--red);background:var(--red-bg);border-radius:6px;padding:6px 10px}
.web .editonly{display:none!important}
/* public web copy is read-only */
.web .actions,.web [data-act="tclose"]{display:none!important}
/* modal */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,16,22,.45)}
dialog form{padding:16px;display:flex;flex-direction:column;gap:10px}
dialog h3{margin:0;font-size:15px}
dialog label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
dialog input,dialog textarea,dialog select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
dialog textarea{min-height:200px;resize:vertical}
.drow{display:flex;gap:8px;flex-wrap:wrap} .drow>label{flex:1;min-width:140px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.msg{font-size:12px} .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.issue,.row,.ask{transition:border-color .15s}}
</style>

<header class="top"><div class="wrap">
  <a id="homeLink" href="/" hidden aria-label="Work Log 홈으로" title="Work Log 홈">←</a>
  <h1><span class="pre">클비서 </span>메일 상황판</h1>
  <span class="stamp" id="stamp">불러오는 중…</span>
  <span class="spacer"></span>
  <button id="refreshBtn" type="button" aria-label="새로고침" title="새로고침">↻</button>
</div></header>

<main class="wrap">
  <div id="connAlert" role="alert" hidden style="margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--red-bg);color:var(--red);border:1px solid var(--red);font-weight:600;font-size:14px"></div>
  <section class="brief" id="brief" hidden>
    <div class="briefTop"><h2 id="briefHead"></h2><a href="#log" class="logLink">브리핑 기록 ›</a></div>
    <ul id="briefList"></ul>
  </section>

  <section class="reply" id="reply" hidden aria-label="답장 대기"></section>

  <div class="kpis" id="kpis">
    <button class="kpi r" data-go="signal" title="내가 처리할 것"><span class="n" id="k-red">–</span><span class="l">처리할 것</span></button>
    <button class="kpi a" data-go="issues" data-due="1" title="기한 3일 이내·지남"><span class="n" id="k-due">–</span><span class="l">기한 임박</span></button>
    <button class="kpi b" data-go="asks" title="회신 기다리는 부탁"><span class="n" id="k-ask">–</span><span class="l">회신 대기</span></button>
    <button class="kpi" data-go="field" data-rma="1" title="RMA 진행 중 · 한 단계에서 7일 넘게 정체된 건"><span class="n" id="k-rma">–</span><span class="l">RMA 진행 · 정체 <span id="k-rma-st">0</span></span></button>
  </div>

  <nav class="tabs" aria-label="보기">
    <a href="#issues" data-v="issues" title="이슈별 묶음">이슈<span class="cnt" id="c-issues">0</span></a>
    <a href="#signal" data-v="signal">신호등</a>
    <a href="#asks" data-v="asks" title="부탁 트래커">부탁<span class="cnt" id="c-asks">0</span></a>
    <a href="#iqc" data-v="iqc" title="수입검사 불량">수입검사<span class="cnt" id="c-iqc">0</span></a>
    <a href="#field" data-v="field" title="필드 불량">필드<span class="cnt" id="c-field">0</span></a>
    <a href="#trace" data-v="trace" title="추적 (S/N·부품)">추적<span class="cnt" id="c-trace">0</span></a>
    <a href="#ylink" data-v="ylink" title="Y: 대장 대조">Y: 대장<span class="cnt" id="c-ylink">0</span></a>
    <a href="#qmeet" data-v="qmeet">품질회의<span class="cnt" id="c-qmeet">0</span></a>
  </nav>

  <div class="filters" id="filters">
    <button class="chip" data-proj="" aria-pressed="true">전체</button>
    <span id="projChips" style="display:contents"></span>
    <input id="q" type="search" placeholder="제목, 사람, 품번, S/N 검색" aria-label="검색">
    <button class="chip" id="onlyNew" aria-pressed="false">새 소식만 <span id="k-new">0</span></button>
    <button class="chip" id="showClosed" aria-pressed="false">완료 포함</button>
  </div>

  <section id="v-issues"></section>
  <section id="v-signal" hidden></section>
  <section id="v-asks" hidden></section>
  <section id="v-iqc" hidden></section>
  <section id="v-field" hidden></section>
  <section id="v-trace" hidden></section>
  <section id="v-ylink" hidden></section>
  <section id="v-qmeet" hidden></section>
  <section id="v-log" class="log" hidden></section>
</main>

<dialog id="dlgDraft"><form method="dialog" id="fDraft">
  <h3 id="dTitle">답장 초안</h3>
  <label>받는 메일<select id="dMail"></select></label>
  <label>어떤 내용으로 쓸까요? (비워두면 맥락에 맞춰 작성)<input id="dIntent" placeholder="예: 내일까지 원인 분석 결과 회신 요청"></label>
  <div class="dfoot" style="justify-content:flex-start"><button type="button" id="dGen">Claude로 초안 쓰기</button><span class="msg" id="dGenMsg"></span></div>
  <label>본문<textarea id="dBody"></textarea></label>
  <div class="dfoot"><span class="msg" id="dMsg"></span><button value="cancel">닫기</button><button type="button" class="primary" id="dSave">Outlook 임시보관함에 저장</button></div>
  <p class="note" style="margin:0">보내지 않아요. Outlook 임시보관함에서 확인한 뒤 직접 보내세요.</p>
</form></dialog>

<dialog id="dlgEvent"><form method="dialog" id="fEvent">
  <h3>내 일정에 등록</h3>
  <label>제목<input id="eSub"></label>
  <div class="drow"><label>날짜<input id="eDate" type="date"></label><label>시작<input id="eStart" type="time" value="09:00"></label><label>끝<input id="eEnd" type="time" value="09:30"></label></div>
  <label>메모<textarea id="eBody" style="min-height:90px"></textarea></label>
  <div class="dfoot"><span class="msg" id="eMsg"></span><button value="cancel">닫기</button><button type="button" class="primary" id="eSave">일정 만들기</button></div>
  <p class="note" style="margin:0">참석자 없이 내 캘린더에만 만들어요. 초대 메일은 나가지 않아요.</p>
</form></dialog>

<dialog id="dlgAsk"><form method="dialog" id="fAsk">
  <h3>부탁 목록에 추가</h3>
  <label>무엇을<input id="aWhat"></label>
  <div class="drow"><label>누구에게<input id="aTo"></label><label>기한<input id="aDue" type="date"></label></div>
  <div class="dfoot"><span class="msg" id="aMsg"></span><button value="cancel">닫기</button><button type="button" class="primary" id="aSave">추가</button></div>
</form></dialog>

<dialog id="dlgDef"><form method="dialog" id="fDef">
  <h3 id="fTitle">불량 등록</h3>
  <div class="dgrid" id="fGrid"></div>
  <div class="dfoot" style="justify-content:flex-start"><button type="button" id="fGen" class="editonly">Claude로 원인·대책 초안</button><span class="msg" id="fGenMsg"></span></div>
  <div class="dfoot"><span class="msg" id="fMsg"></span><button value="cancel">닫기</button><button type="button" class="primary editonly" id="fSave">저장</button></div>
  <p class="note" style="margin:0">S/N(또는 LOT)을 넣고 저장하면 추적 탭의 해당 S/N 이력에도 자동으로 남아요.</p>
</form></dialog>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LV = {red:{t:"처리",c:"p-red",dot:"var(--red)"},yellow:{t:"지켜봄",c:"p-yellow",dot:"var(--amber)"},white:{t:"참고",c:"p-white",dot:"var(--grey)"}};
const STAGES = [["requested","요청함"],["waiting","회신 대기"],["progress","진행 중"],["done","완료"]];
const S = {qm:[], qmMeet:[], qmode:"next", qstage:"", y:{regIqc:[],finalIss:[],calib:[],rayqc:[],meta:null}, fmode:"list", openIds:new Set(), focusId:null, issues:[], asks:[], briefs:[], trace:[], iqc:[], field:[], dstat:"open", tmode:"model", tsel:null, meta:null, view:"issues", proj:"", q:"", closed:false, onlyNew:false, onlyDue:false, loaded:false};
let db=null, mcp=null, sample=null;
const WEB = (document.querySelector('meta[name="mail-dashboard-source"]')||{}).content || "";
const hasData = () => !!db || (WEB && !S.loadErr);

const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const dday = s => { if(!s) return null; const d=new Date(s+"T00:00:00"); return Math.round((d-today())/864e5); };
const ago = iso => { if(!iso) return ""; const m=(Date.now()-new Date(iso))/6e4; if(m<60) return Math.max(1,Math.round(m))+"분 전"; if(m<1440) return Math.round(m/60)+"시간 전"; return Math.round(m/1440)+"일 전"; };
const fmt = iso => iso ? new Date(iso).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}) : "";
const daysSince = iso => iso ? Math.floor((Date.now()-new Date(iso))/864e5) : 0;
const dueTxt = s => { const n=dday(s); if(n==null) return ""; const lbl = n===0?"D-day":n>0?"D-"+n:"D+"+(-n); return `<span class="due ${n<0?"over":""}">${esc(s.slice(5).replace("-","/"))} ${lbl}</span>`; };
// 오늘이면 "15:05", 아니면 "11/17 15:05" — 상단 바를 한 줄로 유지하려고 짧게 쓴다.
function shortWhen(iso){ const d=new Date(iso); if(isNaN(d)) return ""; const hm=d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false}); return d.toDateString()===new Date().toDateString()?hm:`${d.getMonth()+1}/${d.getDate()} ${hm}`; }
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }

/* ---------- filtering ---------- */
function visibleIssues(){
  const q=S.q.trim().toLowerCase();
  return S.issues.filter(i=>{
    if(!S.closed && i.status==="closed") return false;
    if(S.proj && i.project!==S.proj) return false;
    if(S.onlyNew && !i.isNew) return false;
    if(S.onlyDue){ const n=dday(i.due); if(n==null||n>3) return false; }
    if(q){ const hay=[i.title,i.summary,i.nextAction,(i.people||[]).join(" "),(i.mails||[]).map(m=>m.from+" "+m.subject+" "+m.gist).join(" ")].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>{ const o={red:0,yellow:1,white:2}; return (o[a.level]-o[b.level]) || ((dday(a.due)??999)-(dday(b.due)??999)) || String(b.updatedAt).localeCompare(String(a.updatedAt)); });
}

/* ---------- render ---------- */
function render(){
  const m=S.meta||{};
  // 메일 연결이 끊겨 자동 정리를 못 하고 있으면 맨 위에 빨간 경고를 띄운다(정리가 성공하면 connError가 지워진다).
  const ca=$("#connAlert");
  if(m.connError){ ca.hidden=false; ca.textContent=`⚠ 메일 연결 끊김 (${shortWhen(m.connError.at)}부터) — 메일 정리가 멈춰 있어요. Claude 앱 커넥터에서 Microsoft 365를 다시 연결해 주세요.`; }
  else ca.hidden=true;
  $("#stamp").innerHTML = m.lastRunAt ? `<b>${esc(shortWhen(m.lastRunAt))}</b> · ${esc(ago(m.lastRunAt))}` : (S.loaded?"아직 정리 기록이 없어요":"불러오는 중…");
  // 자동 정리 시간·웹 반영 시각은 줄 수를 늘리지 않게 마우스를 올리거나 길게 누르면 보이는 설명으로만 둔다.
  $("#stamp").title = [m.schedule?"자동 정리 "+m.schedule:"", WEB&&S.exportedAt?"웹 반영 "+fmt(S.exportedAt):""].filter(Boolean).join(" · ");
  const last=S.briefs[0];
  if(last){ $("#brief").hidden=false; $("#briefHead").textContent=last.headline||"최근 브리핑"; $("#briefList").innerHTML=(last.items||[]).map(briefItem).join(""); } else $("#brief").hidden=true;

  const open=S.issues.filter(i=>i.status!=="closed");
  renderReply(open);
  const rmas=rmaList();
  const kp={"#k-red":open.filter(i=>i.level==="red").length, "#k-due":open.filter(i=>{const n=dday(i.due);return n!=null&&n<=3;}).length,
    "#k-ask":S.asks.filter(a=>a.stage==="requested"||a.stage==="waiting").length, "#k-rma":rmas.filter(x=>rmaStage(x)!=="완료").length};
  Object.entries(kp).forEach(([s,n])=>{ const e=$(s); e.textContent=S.loaded?n:"–"; e.classList.toggle("zero",S.loaded&&!n); });
  $("#k-rma-st").textContent=rmas.filter(rmaStale).length;
  $("#k-new").textContent=open.filter(i=>i.isNew).length;
  $("#onlyNew").setAttribute("aria-pressed", String(S.onlyNew));
  $("#c-issues").textContent=open.length;
  $("#c-asks").textContent=S.asks.filter(a=>a.stage!=="done").length;

  const projs=[...new Set(S.issues.map(i=>i.project).filter(Boolean))].sort();
  $("#projChips").innerHTML=projs.map(p=>`<button class="chip" data-proj="${esc(p)}" aria-pressed="${S.proj===p}">${esc(p)}</button>`).join("");
  document.querySelector('[data-proj=""]').setAttribute("aria-pressed", String(!S.proj));
  $("#showClosed").setAttribute("aria-pressed", String(S.closed));

  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===S.view?"page":"false"));
  $("#c-trace").textContent=S.trace.filter(t=>t.kind!=="part"&&t.status!=="closed").length;
  $("#c-iqc").textContent=S.iqc.filter(x=>x.status!=="closed").length;
  $("#c-field").textContent=S.field.filter(x=>x.status!=="closed").length;
  VIEWS.forEach(v=>$("#v-"+v).hidden = v!==S.view);
  $("#filters").hidden = S.view==="log";
  const plain = S.view==="trace"||S.view==="iqc"||S.view==="field"||S.view==="ylink"||S.view==="qmeet";
  $("#c-ylink").textContent=yMissing().length;
  $("#c-qmeet").textContent=S.qm.filter(a=>a.stage!=="종결").length;
  $("#projChips").hidden = $("#showClosed").hidden = $("#onlyNew").hidden = document.querySelector('[data-proj=""]').hidden = plain;
  $("#q").placeholder = plain ? "S/N, LOT, 품번, 모델, 협력사, 현상 검색" : "제목, 사람, 품번, S/N 검색";
  ({issues:renderIssues, signal:renderSignal, asks:renderAsks, trace:renderTrace, log:renderLog, ylink:renderYlink, qmeet:renderQm, iqc:()=>renderDef("iqc"), field:()=>renderDef("field")})[S.view]();
}

// 브리핑 한 줄을 "제목(굵게) + 설명(회색)"으로 나눈다: 앞쪽 ":" 또는 " — " 를 기준으로.
function briefItem(t){
  t=String(t||""); let i=-1, k=0;
  const c=t.indexOf(":"), d=t.indexOf(" — ");
  if(c>0&&c<=40&&(d<0||c<d)){ i=c; k=1; } else if(d>0&&d<=60){ i=d; k=3; }
  if(i<0) return `<li><div class="bt">${esc(t)}</div></li>`;
  return `<li><div class="bt">${esc(t.slice(0,i).trim())}</div><div class="bd">${esc(t.slice(i+k).trim())}</div></li>`;
}
/* ---------- 답장 대기: 메일 정리 때 replyWait가 채워진 이슈 (나한테 온 질문·요청에 아직 내가 답장을 안 보냄) ---------- */
const replyAge = i => daysSince(i.replyWait && i.replyWait.at);
function renderReply(open){
  const xs=open.filter(i=>i.replyWait&&i.replyWait.at).sort((a,b)=>String(a.replyWait.at).localeCompare(String(b.replyWait.at)));
  const el=$("#reply"); el.hidden=!xs.length; if(!xs.length) return;
  const late=xs.filter(i=>replyAge(i)>=3).length;
  el.innerHTML=`<h2>답장 대기 <span class="n">${xs.length}</span><span class="note" style="font-weight:400">${late?`3일 넘은 것 ${late}건 · `:""}내가 답해야 하는데 아직 안 보낸 메일</span></h2>`+
    xs.map(i=>{ const r=i.replyWait, n=replyAge(i); return `<div class="rrow" data-open="${esc(i.id)}" tabindex="0"><span class="age ${n>=3?"late":n>=2?"warn":""}">${n?"D+"+n:"오늘"}</span><span class="w"><b>${esc(r.what||i.nextAction||i.title)}</b><span class="s">${esc(i.title)}</span></span><span class="from">${esc(r.from||"")} · ${esc(dshort(r.at))}</span></div>`; }).join("");
}

/* ---------- RMA 진행: 필드 불량 중 회수·반송·교체가 걸린 건 ---------- */
const RMA_ST=[["접수","접수"],["반송","반송 (업체로)"],["분석","업체 분석"],["입고","교체품 입고"],["완료","고객 전달·완료"]];
const rmaStage = x => x.rmaStage || (has(x.rma) ? "접수" : "");
const rmaList = () => S.field.filter(x=>rmaStage(x) && !(x.status==="closed" && !x.rmaStage));
const rmaSince = x => { const d=(x.rmaDates||{})[rmaStage(x)]||x.date||x.createdAt; return d?daysSince(String(d).length===10?d+"T00:00:00":d):0; };
const rmaStale = x => rmaStage(x)!=="완료" && rmaSince(x)>=7;
function renderRma(q){
  const xs=rmaList().filter(x=>defMatch("field",x,q));
  if(!xs.length) return `<div class="empty">RMA가 걸린 필드 불량이 없어요. 필드 불량에 RMA 번호나 단계가 적히면 여기 모여요.</div>`;
  return `<div class="rma">${RMA_ST.map(([k,l],si)=>{ const col=xs.filter(x=>rmaStage(x)===k).sort((a,b)=>rmaSince(b)-rmaSince(a));
    return `<div class="col"><h3><span>${l}</span><span class="note">${col.length}</span></h3>${col.map(x=>`<div class="rcard ${rmaStale(x)?"stale":""}" data-def="${esc(x.id)}" data-kind="field" tabindex="0">
      <span class="code">${esc(x.partSn||x.sn||"S/N 없음")}</span>
      <div class="m"><span>${esc(x.site||"")}</span><span>${esc(x.partName||x.model||"")}</span></div>
      <div class="m"><span>${esc((x.symptom||"").slice(0,40))}</span></div>
      <div class="m">${x.rma?`<span>${esc(String(x.rma).length>36?String(x.rma).slice(0,36)+"…":x.rma)}</span>`:""}<span class="age">${k==="완료"?"완료":"이 단계 "+rmaSince(x)+"일"}</span></div>
      <div class="rsteps">${RMA_ST.map((_,j)=>`<i class="${j<=si?"on":""}"></i>`).join("")}</div></div>`).join("")||'<p class="note" style="margin:4px">없음</p>'}</div>`; }).join("")}</div>
    <p class="note">한 단계에 7일 넘게 머문 건은 빨간 테두리로 표시돼요. 카드를 누르면 단계를 바꿀 수 있어요.</p>`;
}

/* ---------- Y: 드라이브 대장 대조 (ysync.py가 읽어 온 요약, 원본 엑셀은 읽기만) ---------- */
function setY(o){ S.y={regIqc:(o.regIqc||{}).rows||[], finalIss:(o.finalIss||{}).rows||[], calib:(o.calib||{}).rows||[], rayqc:(o.rayqc||{}).rows||[], meta:o.meta||null}; }
const npn = v => String(v||"").toUpperCase().replace(/[\s_]/g,"");
const dgap = (a,b) => (a&&b) ? Math.abs((new Date(String(a).slice(0,10))-new Date(String(b).slice(0,10)))/864e5) : 999;
const yRegFor = x => !has(x.partNo) ? null : S.y.regIqc.filter(r=>npn(r.pn)===npn(x.partNo) && dgap(r.d,x.date)<=30);
const iqcForReg = r => S.iqc.filter(x=>npn(x.partNo)===npn(r.pn) && dgap(r.d,x.date)<=30);
const yOldest = () => (S.y.regIqc[S.y.regIqc.length-1]||{}).d || "";
const yMissing = () => S.y.regIqc.length ? S.iqc.filter(x=>{ const m=yRegFor(x); return m && !m.length && (x.date||"")>=yOldest(); }) : [];
const yLast = () => (S.y.regIqc[0]||{}).d || "";
const yBehind = x => (x.date||"") > yLast();
function yRegCell(x){ if(!S.y.regIqc.length) return '<span class="no-mark">–</span>'; const m=yRegFor(x); if(m==null) return '<span class="note">품번 없음</span>'; return m.length?`<span class="ok-mark" title="${esc(m.map(r=>r.d+" "+r.det).join("\n"))}">✓</span>`:(yBehind(x)?`<span class="pill p-white" title="Y: 대장 마지막 기록이 ${esc(yLast())}이에요">입력 전</span>`:'<span class="pill p-yellow">미등록</span>'); }
const finBySn = code => { const c=String(code||"").toUpperCase(); return c ? S.y.finalIss.filter(r=>r.sn===c) : []; };
function yTraceBlock(t){

  return `<div class="note" style="margin-top:10px">Y: 대장 기록 (읽기 전용)</div><ul class="tl">${
    fin.map(r=>li(r.d,"최종검사 "+(r.p||""),`${r.t} · ${r.c}${r.a?" → "+r.a:""}${r.cz?" ["+r.cz+"]":""}`)).join("")}${

    rq.map(r=>li(r.d,"rayqc 이슈",`${r.ti} (${r.st})`)).join("")}</ul>`;
}
function renderYlink(){

  const q=S.q.trim().toLowerCase(); const hit=o=>!q||Object.values(o).join(" ").toLowerCase().includes(q);
  const miss=yMissing().filter(x=>defMatch("iqc",x,q));
  const recent=y.regIqc.filter(r=>dgap(r.d,new Date().toISOString())<=45).filter(hit);
  const cnt={}; y.finalIss.forEach(r=>{ if(/[A-Z0-9]{5,}/.test(r.sn||"")) cnt[r.sn]=(cnt[r.sn]||0)+1; });
  const rep=Object.entries(cnt).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(([sn,n])=>({sn,n,rows:finBySn(sn)})).filter(g=>!q||g.rows.some(hit));
  const cal=y.calib.filter(hit), rq=y.rayqc.filter(r=>!/완료|종결|close/i.test(r.st)).filter(hit);
  const tbl=(h,rows)=>`<div class="tbl-wrap"><table class="tt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  const sec=(t,n,sub,body)=>`<h3 class="ysec">${t} <span class="note">${n}</span></h3>${sub?`<p class="note" style="margin:0 0 6px">${sub}</p>`:""}${body}`;
  el.innerHTML=`<p class="note">Y: 드라이브 엑셀을 <b>읽기만</b> 해서 메일 대장과 맞춰 봐요. 원본 엑셀은 고치지 않아요. 마지막으로 읽은 시각 ${esc(fmt(y.meta.syncedAt))}${y.meta.rayqcError?" · rayqc 읽기 실패":""}</p>`+
  sec("메일엔 있는데 Y: 수입검사 불량 대장에 없는 건",miss.length,`품번이 같고 날짜가 ±30일 안인 대장 행이 없으면 여기 나와요. <b>Y: 대장(기구수입검사현황 › 부적합리스트) 마지막 기록일은 ${esc(yLast())}</b>이라, 그 뒤에 난 건은 '입력 전'으로 따로 표시해요. 대장 등록은 담당자가 직접 해 주세요.`,
    miss.length?tbl(["발생일","협력사","품번 · 품명","현상","대장"],miss.map(x=>`<tr data-def="${esc(x.id)}" data-kind="iqc"><td class="num">${esc(dshort(x.date))}</td><td>${esc(x.supplier||"")}</td><td><div class="code">${esc(x.partNo||"")}</div><div class="note">${esc(x.partName||"")}</div></td><td>${esc(x.defect||"")}</td><td>${yRegCell(x)}</td></tr>`)):`<div class="empty">모두 대장에 있어요.</div>`)+
  sec("최근 45일 Y: 수입검사 불량 대장",recent.length,"메일 대장에 같은 건이 있으면 ✓ 표시돼요.",
    recent.length?tbl(["발견일","협력사","품번 · 품명","유형","공정","내용 → 조치","메일"],recent.map(r=>{ const m=iqcForReg(r); return `<tr ${m[0]?`data-def="${esc(m[0].id)}" data-kind="iqc"`:""}><td class="num">${esc(dshort(r.d))}</td><td>${esc(r.sup)}</td><td><div class="code">${esc(r.pn)}</div><div class="note">${esc(r.nm)}</div></td><td>${esc(r.t)}</td><td>${esc(r.p)}</td><td>${esc(r.det)}${r.act?`<div class="note">→ ${esc(r.act)}</div>`:""}</td><td>${m.length?'<span class="ok-mark">✓</span>':'<span class="no-mark">–</span>'}</td></tr>`; })):`<div class="empty">최근 45일 기록이 없어요.</div>`)+
  sec("최종검사 issue 반복 S/N",rep.length,"같은 장비 S/N에서 최종검사 부적합이 2번 이상 난 건이에요.",
    rep.length?tbl(["S/N","횟수","모델","내용"],rep.map(g=>`<tr><td class="code">${esc(g.sn)}</td><td class="num">${g.n}</td><td>${esc(g.rows[0].m)}</td><td>${g.rows.map(r=>`<div><span class="note">${esc(dshort(r.d))}</span> ${esc(r.t)} · ${esc(r.c)}${r.a?` → ${esc(r.a)}`:""}</div>`).join("")}</td></tr>`)):`<div class="empty">반복 S/N이 없어요.</div>`)+
  sec("계측기 교정 만료·60일 이내",cal.length,"",

  sec("rayqc 이슈 트래커 진행 중",rq.length,"",
    rq.length?tbl(["발생일","제목","S/N","국가","상태"],rq.map(r=>`<tr><td class="num">${esc(dshort(r.d))}</td><td><a href="https://rayqc.vercel.app/issues/${esc(r.id)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(r.ti)}</a></td><td class="code">${esc(r.sn)}</td><td>${esc(r.co)}</td><td>${esc(r.st)}</td></tr>`)):`<div class="empty">진행 중인 이슈가 없어요.</div>`);

/* ---------- 품질회의: [품질회의 상정]·[안건 업데이트]·회의록 메일을 안건 하나에 카드 하나로 ---------- */
const QST=["상정","원인분석","대책","검증","종결"];
const QST_T={"상정":"상정","원인분석":"원인 분석","대책":"대책","검증":"검증","종결":"종결"};
function setQm(list){ S.qmMeet=((list.find(d=>d.id==="_meetings")||{}).meetings||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))); S.qm=list.filter(d=>d.id&&d.id[0]!=="_"); }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// 품질회의는 월·목 10시. 오늘이 월·목이고 10시 전이면 오늘이 다음 회의.
function qmNext(){ const d=new Date(); const before10=d.getHours()<10; for(let k=0;k<8;k++){ const x=new Date(d); x.setDate(d.getDate()+k); const w=x.getDay(); if((w===1||w===4)&&(k>0||before10)) return ymd(x); } return ""; }
function qmLast(){ const t=ymd(new Date()); const m=S.qmMeet.find(x=>x.date<=t); if(m) return m.date; const d=new Date(); for(let k=0;k<8;k++){ const x=new Date(d); x.setDate(d.getDate()-k); const w=x.getDay(); if((w===1||w===4)&&(k>0||d.getHours()>=10)) return ymd(x); } return ""; }
const qmSns = a => String(a.sn||"").toUpperCase().split(/[,\s/]+/).filter(s=>s.length>=5);
const qmField = a => { const ss=qmSns(a); return ss.length ? S.field.filter(x=>ss.includes(String(x.sn||"").toUpperCase())) : []; };
const qmOpenAsks = a => (a.asksMine||[]).filter(x=>!x.done);
const qmChanged = (a,since) => (a.raisedAt||"")>since || (a.lastAt||"")>since;
function qmCard(a, since){
  const k=Math.max(0,QST.indexOf(a.stage||"상정")); const closed=a.stage==="종결";
  const oa=qmOpenAsks(a); const color = closed?"grey":oa.length?"red":(a.stage==="상정"?"yellow":"");
  const isNew=(a.raisedAt||"")>since, upd=!isNew&&(a.lastAt||"")>since;
  const ev=(a.events||[]).slice().sort((x,y)=>String(x.at).localeCompare(String(y.at)));
  const ol=mid=>mid?`<a href="https://outlook.office365.com/owa/?ItemID=${encodeURIComponent(mid)}&exvsurl=1&viewmodel=ReadMessageItem" target="_blank" rel="noopener">Outlook에서 열기</a>`:"";
  const fl=qmField(a);
  return `<details class="issue ${color}" data-id="${esc(a.id)}" ${S.openIds.has(a.id)?"open":""}>
    <summary>
      <div class="ititle">${esc(a.title)}</div>
      <div class="imeta">${isNew?'<span class="pill p-new">새 안건</span>':upd?'<span class="pill p-yellow">진행 소식</span>':""}${oa.length?`<span class="pill p-red">우리 팀 요청 ${oa.length}</span>`:""}<span class="pill ${closed?"p-done":"p-white"}">${esc(QST_T[a.stage]||a.stage||"상정")}</span></div>
      <div class="imeta"><span class="qsteps" title="${esc(QST.join(" → "))}">${QST.map((_,j)=>`<i class="${j<=k?"on":""}"></i>`).join("")}</span>${a.product?`<span>${esc(a.product)}</span>`:""}${a.sn?`<span class="code">${esc(a.sn)}</span>`:""}${a.site?`<span>${esc(a.site)}</span>`:""}<span>상정 ${esc(dshort(a.raisedAt))} ${esc(a.raisedBy||"")}${a.raisedTeam?" · "+esc(a.raisedTeam):""}</span>${a.lastAt?`<span>최근 ${esc(dshort(a.lastAt))}</span>`:""}</div>
      ${a.lastWhat?`<div class="inext"><b>최근</b> ${esc(a.lastWhat)}</div>`:""}
    </summary>
    <div class="ibody">
      <div class="qgrid"><div><b>현상</b>${esc(a.symptom||"–")}</div><div><b>원인</b>${esc(a.cause||"아직 확인 전")}</div><div><b>대책·조치</b>${esc(a.action||"아직 없음")}</div></div>
      ${(a.asksMine||[]).length?`<div class="note">품질검사팀 요청</div><ul class="qasks">${a.asksMine.map((x,j)=>`<li><span class="${x.done?"ok":"wait"}">${x.done?"✓ 완료":"● 대기"}</span> ${esc(x.what)} <button class="qbtn editonly" data-act="qask" data-id="${esc(a.id)}" data-i="${j}">${x.done?"대기로 되돌리기":"완료 처리"}</button> <span class="note">— ${esc(x.from||"")} ${esc(dshort(x.at))}${x.due?" · 기한 ":""}</span>${x.due?dueTxt(x.due):""}</li>`).join("")}</ul>`:""}
      ${fl.length?`<div class="rel"><span class="note">필드 불량 대장</span>${fl.map(x=>`<button class="tchip" data-def="${esc(x.id)}" data-kind="field">${esc(x.sn)} · ${esc(dshort(x.date))}</button>`).join("")}</div>`:""}
      ${(a.meetings||[]).length?`<p class="note">회의에서 다룬 날: ${a.meetings.map(d=>esc(dshort(d))).join(", ")}</p>`:""}
      <ul class="thread">${ev.map(e=>`<li><span class="who">${esc(e.by)}</span><span class="when">${esc(String(e.at||"").replace("T"," ").slice(5,16))}</span> <span class="pill p-proj">${esc(e.kind)}</span><div class="gist">${esc(e.what)}</div>${ol(e.mid)}</li>`).join("")}</ul>
      <div class="actions editonly"><button data-act="qclose" data-id="${esc(a.id)}" class="${closed?"":"primary"}">${closed?"다시 열기":"종결 처리"}</button><label class="note">단계 <select data-qmset="${esc(a.id)}">${QST.map(s=>`<option value="${s}" ${s===(a.stage||"상정")?"selected":""}>${QST_T[s]}</option>`).join("")}</select></label>${a.stageManual?'<span class="note">직접 정한 단계예요 (메일 정리가 바꾸지 않아요)</span>':""}</div>
    </div>
  </details>`;
}
function renderQm(){
  const el=$("#v-qmeet");
  if(!S.qm.length){ el.innerHTML=`<div class="empty">아직 정리된 품질회의 안건이 없어요. 메일 정리 때 [품질회의 상정]·[안건 업데이트]·회의록 메일을 모아요.</div>`; return; }
  const q=S.q.trim().toLowerCase();
  const hit=a=>!q||[a.title,a.sn,a.partSn,a.site,a.product,a.symptom,a.cause,a.action,a.raisedBy,a.lastWhat,(a.events||[]).map(e=>e.by+" "+e.what).join(" ")].join(" ").toLowerCase().includes(q);
  const last=qmLast(), next=qmNext();
  const open=S.qm.filter(a=>a.stage!=="종결");
  const chg=S.qm.filter(a=>qmChanged(a,last));
  const asks=S.qm.flatMap(a=>(a.asksMine||[]).map(x=>({...x,a})));
  const oAsks=asks.filter(x=>!x.done);
  const modes=`<div class="tmodes"><button class="chip" data-qmode="next" aria-pressed="${S.qmode==="next"}">다음 회의 준비 <b>${chg.length}</b></button><button class="chip" data-qmode="all" aria-pressed="${S.qmode==="all"}">전체 안건</button><button class="chip" data-qmode="mine" aria-pressed="${S.qmode==="mine"}">우리 팀 요청 <b>${oAsks.length}</b></button></div>`;
  const head=`<div class="qhead"><div><div class="note">다음 품질회의</div><div class="big">${esc(dshort(next))} (${["일","월","화","수","목","금","토"][new Date(next+"T00:00").getDay()]}) 10:00</div></div><div><div class="note">지난 회의</div><div class="big">${esc(dshort(last))}</div></div><div><div class="note">그 뒤 새 안건 · 진행 소식</div><div class="big">${S.qm.filter(a=>(a.raisedAt||"")>last).length} · ${chg.filter(a=>(a.raisedAt||"")<=last).length}</div></div><div><div class="note">진행 중 안건</div><div class="big">${open.length}</div></div></div>`;
  if(S.qmode==="mine"){
    const asks=S.qm.flatMap(a=>(a.asksMine||[]).map((x,j)=>({...x,a,j})));
    const rows=asks.filter(x=>hit(x.a)||(q&&String(x.what).toLowerCase().includes(q))).sort((x,y)=>(x.done-y.done)||String(y.at).localeCompare(String(x.at)));
    el.innerHTML=modes+head+(rows.length?`<div class="tbl-wrap"><table class="tt"><thead><tr><th>상태</th><th>요청 내용</th><th>안건</th><th>요청자</th><th>요청일</th><th>기한</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.done?'<span class="pill p-done">완료</span>':'<span class="pill p-red">대기</span>'}<div class="editonly" style="margin-top:4px"><button class="qbtn" data-act="qask" data-id="${esc(x.a.id)}" data-i="${x.j}">${x.done?"되돌리기":"완료 처리"}</button></div></td><td>${esc(x.what)}</td><td>${esc(x.a.title)}</td><td>${esc(x.from||"")}</td><td class="num">${esc(dshort(x.at))}</td><td>${x.due?dueTxt(x.due):""}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">품질검사팀에 온 요청이 없어요.</div>`);
    return;
  }
  const cnt=s=>S.qm.filter(a=>(a.stage||"상정")===s).length;
  const stg=S.qmode==="all"?`<div class="dbar">${QST.map(s=>`<button class="chip" data-qstage="${s}" aria-pressed="${S.qstage===s}">${QST_T[s]} ${cnt(s)}</button>`).join("")}</div>`:"";
  let xs = S.qmode==="next" ? chg : S.qm.filter(a=>S.qstage?(a.stage||"상정")===S.qstage:a.stage!=="종결");
  xs=xs.filter(hit).sort((a,b)=>(qmOpenAsks(b).length>0)-(qmOpenAsks(a).length>0) || String(b.lastAt||b.raisedAt).localeCompare(String(a.lastAt||a.raisedAt)));
  const sub = S.qmode==="next" ? `<p class="note">지난 회의(${esc(dshort(last))}) 뒤에 새로 상정됐거나 진행 소식이 온 안건이에요. 회의 들어가기 전에 이것만 보시면 돼요.</p>` : `<p class="note">종결 안건은 '종결' 칩을 눌러 보세요.</p>`;
  el.innerHTML=modes+head+stg+sub+(xs.length?`<div class="list">${xs.map(a=>qmCard(a,last)).join("")}</div>`:`<div class="empty">${S.qmode==="next"?"지난 회의 뒤로 바뀐 안건이 없어요.":"조건에 맞는 안건이 없어요."}</div>`);
}

function emptyMsg(){
  if(!S.loaded) return `<div class="empty">메일 정리 결과를 불러오는 중이에요…</div>`;
  if(WEB && S.loadErr) return `<div class="empty">메일 상황판 데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>`;
  if(!hasData()) return `<div class="empty">이 화면에서는 데이터를 불러올 수 없어요. claude.ai에 로그인한 상태로 열어 주세요.</div>`;
  if(!S.issues.length) return `<div class="empty">아직 정리된 메일이 없어요. 정해진 시간에 자동으로 채워지고, Claude에게 "메일 정리해줘"라고 하면 바로 채워져요.</div>`;
  return `<div class="empty">조건에 맞는 이슈가 없어요. 필터를 풀어 보세요.</div>`;
}

function issueCard(i, open){
  const lv=LV[i.level]||LV.white;
  const mails=(i.mails||[]).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const filt=[S.onlyNew?"새 소식만":"",S.onlyDue?"기한 임박만":""].filter(Boolean);
  return `<details class="issue ${esc(i.level)}${i.id===S.focusId?" focus":""}" data-id="${esc(i.id)}" ${open?"open":""}>
    <summary>
      <div class="ititle">${esc(i.title)}</div>
      <div class="imeta">${i.replyWait&&i.replyWait.at?`<span class="pill p-reply">답장 대기 D+${replyAge(i)}</span>`:""}${i.isNew?'<span class="pill p-new">NEW</span>':""}<span class="pill ${lv.c}">${lv.t}</span>${i.status==="closed"?'<span class="pill p-done">완료</span>':""}</div>
      <div class="imeta">${i.project?`<span class="pill p-proj">${esc(i.project)}</span>`:""}<span>메일 ${mails.length}통</span><span>${esc((i.people||[]).slice(0,4).join(", "))}</span>${dueTxt(i.due)}<span>${esc(ago(i.updatedAt))}</span></div>
      ${i.nextAction?`<div class="inext"><b>할 일</b> ${esc(i.nextAction)}</div>`:""}
    </summary>
    <div class="ibody">
      ${i.summary?`<p>${esc(i.summary)}</p>`:""}
      ${(()=>{ const ts=S.trace.filter(t=>(t.issueIds||[]).includes(i.id)); return ts.length?`<div class="rel" style="margin-top:8px"><span class="note">추적 대상</span>${ts.map(t=>`<button class="tchip ${t.status!=="closed"&&t.kind!=="part"?"bad":""}" data-act="trace" data-id="${esc(t.id)}">${esc(t.code)}</button>`).join("")}</div>`:""; })()}
      <ul class="thread">${mails.map(m=>`<li><span class="who">${esc(m.from)}</span><span class="when">${esc(fmt(m.at))}</span><div class="gist">${esc(m.gist||m.subject)}</div>${(m.link||m.mid)?`<a href="${esc(m.link||("https://outlook.office365.com/owa/?ItemID="+encodeURIComponent(m.mid)+"&exvsurl=1&viewmodel=ReadMessageItem"))}" target="_blank" rel="noopener">Outlook에서 열기</a>`:""}</li>`).join("")}</ul>
      <div class="actions">

/* ---------- traceability ---------- */
const KIND={serial:"시리얼",part:"부품",lot:"LOT",product:"제품"};
const EVC={"발생":"ev-fail","불량판정":"ev-fail","재발":"ev-fail","교체":"ev-swap","탈거":"ev-swap","장착":"ev-swap","회수":"ev-swap","RMA":"ev-swap","출하":"","입고":"","입고검사":"ev-ok","조치":"ev-ok","종결":"ev-ok","확인":"ev-ok"};
const tById = id => S.trace.find(t=>t.id===id);
const tLast = t => (t.events||[]).reduce((m,e)=>e.at>m?e.at:m, t.lastAt||"");
const tFails = t => (t.events||[]).filter(e=>/발생|불량|재발/.test(e.type||"")).length;
const dshort = s => s ? String(s).slice(0,10).replace(/^\d{4}-/,"").replace("-","/") : "";
function traceMatch(t,q){ if(!q) return true; return [t.code,t.kind,t.model,t.partNo,t.partName,t.supplier,t.parentSn,t.site,t.note,(t.events||[]).map(e=>e.type+" "+e.text).join(" ")].join(" ").toLowerCase().includes(q); }
function traceRow(t){
  const st=t.status==="closed"?'<span class="pill p-done">종결</span>':(t.kind==="part"?'<span class="pill p-yellow">관리 중</span>':'<span class="pill p-red">추적 중</span>');
  return `<tr data-key="${esc(t.id)}" class="${S.tsel===t.id?"sel":""}"><td><div class="code">${esc(t.code)}</div><div class="note">${esc(KIND[t.kind]||t.kind)}${t.parentSn?" · 상위 "+esc(t.parentSn):""}</div></td><td>${esc(t.model||"")}${t.partName?`<div class="note">${esc(t.partNo?t.partNo+" ":"")}${esc(t.partName)}</div>`:""}</td><td>${st}</td><td class="num">${tFails(t)}</td><td class="num">${esc(dshort(tLast(t)))}</td></tr>`;
}
const thead=`<thead><tr><th>S/N · 품번</th><th>제품 · 부품</th><th>상태</th><th class="num">불량</th><th class="num">최근</th></tr></thead>`;
function renderTrace(){
  const q=S.q.trim().toLowerCase();
  const xs=S.trace.filter(t=>traceMatch(t,q)).sort((a,b)=>String(tLast(b)).localeCompare(String(tLast(a))));
  const modes=`<div class="tmodes">${[["model","제품별"],["part","부품별"],["serial","시리얼별"]].map(([k,l])=>`<button class="chip" data-tmode="${k}" aria-pressed="${S.tmode===k}">${l}</button>`).join("")}<span class="note" style="align-self:center;margin-left:6px">메일을 정리할 때마다 S/N·품번별 이력이 자동으로 쌓여요.</span></div>`;
  if(!S.loaded||!hasData()){ $("#v-trace").innerHTML=emptyMsg(); return; }
  if(!S.trace.length){ $("#v-trace").innerHTML=modes+`<div class="empty">아직 추적 중인 S/N·부품이 없어요. 다음 메일 정리부터 불량 메일 속 시리얼·품번을 자동으로 모아요.</div>`; return; }
  let body="";
  if(S.tmode==="serial"){
    const rows=xs.filter(t=>t.kind!=="part");
    body = rows.length?`<div class="tbl-wrap"><table class="tt">${thead}<tbody>${rows.map(traceRow).join("")}</tbody></table></div>`:`<div class="empty">조건에 맞는 시리얼이 없어요.</div>`;
  } else {
    const key = S.tmode==="model" ? (t=>t.model||(t.kind==="part"?"협력사 부품 (품번 단위)":"모델 미상")) : (t=>t.partNo||(t.kind==="part"?t.code:"")||(t.partName?t.partName:"품번 미상"));
    const groups={}; xs.forEach(t=>{ (groups[key(t)]=groups[key(t)]||[]).push(t); });
    const names=Object.keys(groups).sort((a,b)=>String(tLast(groups[b][0])).localeCompare(String(tLast(groups[a][0]))));
    body = names.length? names.map(n=>{ const g=groups[n]; const open=g.filter(t=>t.kind!=="part"&&t.status!=="closed").length; const fails=g.reduce((s,t)=>s+tFails(t),0);
      const head=g.find(t=>t.kind==="part"); const sub = S.tmode==="part" && head ? `${esc(head.partName||"")}${head.supplier?" · "+esc(head.supplier):""}` : "";
      return `<details class="grp" ${q||names.length<=4?"open":""}><summary><span class="gt ${S.tmode==="part"?"code":""}">${esc(n)}</span><span class="note">${sub}</span><span class="note">항목 ${g.length} · 추적 중 ${open} · 불량 기록 ${fails}</span></summary><div class="tbl-wrap"><table class="tt">${thead}<tbody>${g.map(traceRow).join("")}</tbody></table></div></details>`; }).join("") : `<div class="empty">조건에 맞는 항목이 없어요.</div>`;
  }
  $("#v-trace").innerHTML = modes + `<div class="tgrid"><div style="min-width:0">${body}</div><div style="min-width:0">${traceDetail()}</div></div>`;
}
function traceDetail(){
  const t=S.tsel&&tById(S.tsel);
  if(!t) return `<div class="detail"><p class="note" style="margin:0">왼쪽에서 S/N이나 품번을 고르면 발생·교체·RMA 이력이 시간순으로 보여요.</p></div>`;
  const kids=S.trace.filter(x=>x.parentSn&&x.parentSn===t.code);
  const parent=t.parentSn&&S.trace.find(x=>x.code===t.parentSn);
  const sib = t.partNo ? S.trace.filter(x=>x.id!==t.id&&x.partNo===t.partNo&&x.kind!=="part") : [];
  const lot = t.lot ? S.trace.filter(x=>x.id!==t.id&&x.lot===t.lot) : [];
  const chip = x=>`<button class="tchip ${x.status!=="closed"&&tFails(x)?"bad":""}" data-act="trace" data-id="${esc(x.id)}">${esc(x.code)}</button>`;
  const evs=(t.events||[]).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const iss=(t.issueIds||[]).map(byId).filter(Boolean);
  return `<div class="detail">
    <div class="note">${esc(KIND[t.kind]||t.kind)}${t.model?" · "+esc(t.model):""}</div>
    <h3>${esc(t.code)}</h3>
    <dl class="attrs">
      ${t.partNo||t.partName?`<dt>부품</dt><dd>${esc([t.partNo,t.partName].filter(Boolean).join(" "))}</dd>`:""}
      ${t.supplier?`<dt>협력사</dt><dd>${esc(t.supplier)}</dd>`:""}
      ${t.lot?`<dt>LOT·제조일</dt><dd>${esc(t.lot)}</dd>`:""}
      ${t.site?`<dt>설치처</dt><dd>${esc(t.site)}</dd>`:""}
      ${t.note?`<dt>메모</dt><dd>${esc(t.note)}</dd>`:""}
      <dt>상태</dt><dd>${t.status==="closed"?"종결":"추적 중"} <button data-act="tclose" data-id="${esc(t.id)}" style="padding:1px 8px;font-size:12px">${t.status==="closed"?"다시 추적":"종결 처리"}</button></dd>
    </dl>
    ${parent?`<div class="note">장착 장비</div><div class="rel">${chip(parent)}</div>`:""}
    ${kids.length?`<div class="note" style="margin-top:6px">장착·교체 이력 부품</div><div class="rel">${kids.map(chip).join("")}</div>`:""}
    ${lot.length?`<div class="note" style="margin-top:6px">같은 LOT</div><div class="rel">${lot.map(chip).join("")}</div>`:""}
    ${sib.length?`<div class="note" style="margin-top:6px">같은 품번의 다른 S/N</div><div class="rel">${sib.map(chip).join("")}</div>`:""}
    <ul class="tl">${evs.map(e=>`<li class="${EVC[e.type]??""}"><span class="d">${esc(e.at?String(e.at).slice(0,10):"")}</span><span class="ty">${esc(e.type||"")}</span> ${esc(e.text||"")}${e.issueId&&byId(e.issueId)?` <a href="#issues" data-act="goto" data-id="${esc(e.issueId)}" style="font-size:12px;color:var(--accent)">이슈</a>`:""}${e.mid?` <a href="${esc("https://outlook.office365.com/owa/?ItemID="+encodeURIComponent(e.mid)+"&exvsurl=1&viewmodel=ReadMessageItem")}" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent)">메일</a>`:""}</li>`).join("")||'<li class="note">이력 없음</li>'}</ul>
    ${yTraceBlock(t)}
    ${iss.length?`<div class="note" style="margin-top:6px">관련 이슈</div><div class="rel">${iss.map(i=>`<button class="tchip" data-act="goto" data-id="${esc(i.id)}" style="font-family:var(--f-body)">${esc(i.title)}</button>`).join("")}</div>`:""}
  </div>`;
}

/* ---------- defect registers: 수입검사 불량(iqc) / 필드 불량(field) ---------- */
const STAT=[["new","접수"],["analysis","원인 분석"],["action","대책 시행"],["verify","효과 확인"],["closed","종결"]];
const STAT_T=Object.fromEntries(STAT);
const M4=["","사람","설비","재료","방법","설계","측정","미상"];
const DEF={
  iqc:{name:"수입검사 불량", fields:[
    ["#","불량 내용"],
    ["date","발생일 *","date"],["supplier","협력사 *"],["partNo","품번 *"],["partName","품명"],
    ["qtyIn","입고 수량","number"],["qtyNg","불량 수량","number"],
    ["defectType","불량 유형","select",["","치수","외관","기능·전기","이종·오삽","누락·수량","포장·표기","기타"]],
    ["disposition","처리","select",["","반품","선별","재작업","특채","폐기","업체 수리"]],
    ["defect","불량 현상 *","area"],
    ["#","추적성 (S/N·LOT 필수)"],
    ["lot","LOT·제조일·입고일"],["sns","S/N (여러 개면 쉼표로)"],["noSnReason","S/N·LOT이 없으면 그 사유","wide"],
    ["#","원인과 대책"],
    ["cause","원인","area"],["causeType","원인 구분 (4M)","select",M4],
    ["actionTemp","임시 대책 (봉쇄·선별)","area"],["actionPerm","영구 대책 (재발 방지)","area"],["verify","효과 확인 방법·결과","area"],
    ["#","관리"],
    ["owner","담당"],["due","기한","date"],["ncrNo","부적합 보고서 번호"],["status","상태","select",STAT],["note","메모","area"]
  ]},
  field:{name:"필드 불량", fields:[
    ["#","불량 내용"],
    ["date","발생일 *","date"],["site","국가·고객·설치처 *"],["model","제품·모델 *"],["errorCode","에러 코드"],
    ["defectType","불량 유형","select",["","전원·전기","X-ray·튜브","누유","디텍터·영상","기구·소음","SW·통신","외관","기타"]],
    ["usage","설치일·사용 기간"],
    ["symptom","현상 *","area"],
    ["#","추적성 (장비 S/N 필수)"],
    ["sn","장비 S/N"],["partSn","불량 부품 S/N"],["partNo","불량 부품 품번"],["partName","부품명"],["lot","부품 LOT·제조일"],["rma","RMA 번호·회수 여부"],["rmaStage","RMA 단계","select",[["","해당 없음"],...RMA_ST]],
    ["newPartSn","교체 장착한 부품 S/N"],["noSnReason","S/N이 없으면 그 사유"],
    ["#","원인과 대책"],
    ["cause","원인","area"],["causeType","원인 구분 (4M)","select",M4],
    ["actionTemp","현장 조치 (교체·수리)","area"],["actionPerm","영구 대책 (재발 방지)","area"],["verify","효과 확인 방법·결과","area"],
    ["#","관리"],
    ["owner","담당"],["due","기한","date"],["status","상태","select",STAT],["note","메모","area"]
  ]}
};
const splitSn = s => String(s||"").split(/[,\n;/]+/).map(x=>x.trim()).filter(Boolean);
const snOk = (k,x) => k==="iqc" ? !!(splitSn(x.sns).length||String(x.lot||"").trim()||String(x.noSnReason||"").trim()) : !!(String(x.sn||"").trim()||String(x.noSnReason||"").trim());
const has = v => !!String(v??"").trim();
function defMatch(k,x,q){ if(!q) return true; return DEF[k].fields.map(f=>f[0]==="#"?"":x[f[0]]).concat([x.issueId]).join(" ").toLowerCase().includes(q); }
function defRepeat(k,x){ const key = k==="iqc" ? x.partNo : (x.partNo||x.sn); if(!has(key)) return 0; return S[k].filter(y=>(k==="iqc"?y.partNo:(y.partNo||y.sn))===key).length; }
function renderDef(k){
  const el=$("#v-"+k);
  if(!S.loaded||!hasData()){ el.innerHTML=emptyMsg(); return; }
  const q=S.q.trim().toLowerCase();
  const all=S[k];
  const xs=all.filter(x=>(S.dstat==="all"||(S.dstat==="open"?x.status!=="closed":(x.status||"new")===S.dstat)) && defMatch(k,x,q))
    .sort((a,b)=>String(b.date||b.createdAt).localeCompare(String(a.date||a.createdAt)));
  const open=all.filter(x=>x.status!=="closed");
  const noCause=open.filter(x=>!has(x.cause)).length, noAct=open.filter(x=>!has(x.actionPerm)).length, noSn=all.filter(x=>!snOk(k,x)).length;
  const chips=[["open","진행 중"],...STAT,["all","전체"]].map(([v,l])=>`<button class="chip" data-dstat="${v}" aria-pressed="${S.dstat===v}">${l}</button>`).join("");
  if(k==="field"){
    const modes=`<div class="tmodes"><button class="chip" data-fmode="list" aria-pressed="${S.fmode!=="rma"}">목록</button><button class="chip" data-fmode="rma" aria-pressed="${S.fmode==="rma"}">RMA 진행 (반송·교체품 입고)</button></div>`;
    if(S.fmode==="rma"){ el.innerHTML=modes+renderRma(q); return; }
    el.innerHTML=modes; // 아래에서 목록을 이어 붙인다
  }
  const bar=(k==="field"?el.innerHTML:"")+`<div class="dbar">${chips}<span class="spacer"></span><button class="primary editonly" data-act="defnew" data-kind="${k}">+ 직접 등록</button></div>
    <div class="dstat"><span>진행 중 <b>${open.length}</b></span><span class="${noCause?"bad":""}">원인 미작성 <b>${noCause}</b></span><span class="${noAct?"bad":""}">영구 대책 미작성 <b>${noAct}</b></span><span class="${noSn?"bad":""}">S/N·LOT 누락 <b>${noSn}</b></span><span>메일 정리 때 자동 분류돼요 · 행을 누르면 원인·대책을 쓰고 고칠 수 있어요</span></div>`;

  // 필드 불량: 수입검사 탭처럼 셀마다 굵은 대표값 + 회색 보조줄
  const siteCell=x=>{ const s=String(x.site||""), i=s.indexOf(" / "); return i<0?esc(s):`${esc(s.slice(0,i))}<div class="note">${esc(s.slice(i+3))}</div>`; };
  const modelCell=x=>`<span ${String(x.model||"").length<=14?'style="white-space:nowrap"':""}>${esc(x.model||"")}</span>${has(x.partNo)||has(x.partName)?`<div class="note">${has(x.partNo)?`<span class="code">${esc(x.partNo)}</span> `:""}${esc(x.partName||"")}</div>`:""}`;

  const row = x => k==="iqc"

  el.innerHTML = bar + (xs.length?`<div class="tbl-wrap"><table class="tt"><thead>${head}</thead><tbody>${xs.map(row).join("")}</tbody></table></div>`:`<div class="empty">조건에 맞는 항목이 없어요.</div>`);

const traceDocId=(p,code)=>p+"~"+String(code).toUpperCase().replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");
async function syncTrace(k,id,x){
  // 저장한 불량을 S/N·LOT 추적 대장(trace)에도 남긴다. 같은 불량(defId)으로 남긴 이벤트는 덮어써서 중복이 생기지 않게 한다.
  const day=(x.date||new Date().toISOString()).slice(0,10);
  const items=[];
  if(k==="iqc"){
    const txt=`수입검사 불량: ${x.defect}${x.qtyNg?` (${x.qtyNg}${x.qtyIn?"/"+x.qtyIn:""}EA)`:""}${x.disposition?" → "+x.disposition:""}`;
    splitSn(x.sns).forEach(c=>items.push({id:traceDocId("sn",c),base:{kind:"serial",code:c,model:x.partName||"",partNo:x.partNo||"",partName:x.partName||"",supplier:x.supplier||"",lot:x.lot||""},type:"불량판정",text:txt}));
    if(has(x.lot)) items.push({id:traceDocId("lot",(x.partNo?x.partNo+" ":"")+x.lot),base:{kind:"lot",code:(x.partNo?x.partNo+" ":"")+x.lot,partNo:x.partNo||"",partName:x.partName||"",supplier:x.supplier||"",lot:x.lot},type:"입고검사",text:txt});
  } else {
    const txt=`필드 불량: ${x.symptom}${x.errorCode?" ["+x.errorCode+"]":""}${x.site?" @"+x.site:""}`;
    if(has(x.sn)) items.push({id:traceDocId("sn",x.sn),base:{kind:"serial",code:x.sn,model:x.model||"",site:x.site||""},type:"발생",text:txt+(has(x.partSn)&&has(x.newPartSn)?` · 부품 교체 ${x.partSn} → ${x.newPartSn}`:"")});
    if(has(x.partSn)) items.push({id:traceDocId("sn",x.partSn),base:{kind:"serial",code:x.partSn,model:x.partName||x.model||"",partNo:x.partNo||"",partName:x.partName||"",lot:x.lot||"",parentSn:x.sn||""},type:has(x.newPartSn)?"탈거":"발생",text:txt});
    if(has(x.newPartSn)) items.push({id:traceDocId("sn",x.newPartSn),base:{kind:"serial",code:x.newPartSn,model:x.partName||"",partNo:x.partNo||"",partName:x.partName||"",parentSn:x.sn||""},type:"장착",text:`${x.sn||"장비"}에 교체 장착 (필드 불량 ${id})`});
  }
  const ids=[];
  for(const it of items){
    const ev={at:day,type:it.type,text:it.text,defId:id,issueId:x.issueId||""};
    const ex=S.trace.find(t=>t.id===it.id);
    try{
      if(ex){
        const evs=(ex.events||[]).filter(e=>!(e.defId===id&&e.type===it.type)).concat([ev]).slice(-100);
        const upd={events:evs,lastAt:day>(ex.lastAt||"")?day:ex.lastAt,defIds:[...new Set([...(ex.defIds||[]),id])]};
        Object.entries(it.base).forEach(([kk,vv])=>{ if(vv&&!ex[kk]) upd[kk]=vv; });
        if(ex.status==="closed") upd.status="open";
        await db.doc("trace/"+it.id).update(upd);
      } else {
        await db.doc("trace/"+it.id).set(Object.assign({status:"open",issueIds:x.issueId?[x.issueId]:[],firstAt:day,lastAt:day,note:"",events:[ev],defIds:[id]},it.base));
      }
      ids.push(it.id);
    }catch(e){ console.warn("trace sync",it.id,e); }
  }
  return ids;
}
$("#fSave").addEventListener("click",async()=>{
  const {k,id,isNew,base}=dcur; const x=formVals(); const msg=$("#fMsg");
  const need = k==="iqc" ? [["date","발생일"],["supplier","협력사"],["partNo","품번"],["defect","불량 현상"]] : [["date","발생일"],["site","설치처"],["model","모델"],["symptom","현상"]];
  const miss=need.filter(([f])=>!has(x[f])).map(([,l])=>l);
  if(miss.length){ msg.className="msg err"; msg.textContent=miss.join(", ")+"을(를) 채워 주세요."; return; }
  if(!snOk(k,x)){ msg.className="msg err"; msg.textContent="추적성: S/N(LOT) 또는 없는 사유를 꼭 적어 주세요."; snCheck(); return; }
  if(!db){ msg.className="msg err"; msg.textContent="저장할 수 없어요. 로그인 상태를 확인해 주세요."; return; }
  const now=new Date().toISOString();
  const did = id || (k+"-"+(x.date||now.slice(0,10)).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6));
  $("#fSave").disabled=true; msg.className="msg"; msg.textContent="저장하는 중…";
  try{
    const data=Object.assign({},x,{updatedAt:now});
    if(x.status==="closed" && base.status!=="closed") data.closedAt=now;
    if(k==="field" && (x.rmaStage||"")!==(base.rmaStage||"") && x.rmaStage) data.rmaDates=Object.assign({},base.rmaDates||{},{[x.rmaStage]:now.slice(0,10)});
    if(isNew){ Object.assign(data,{createdAt:now,source:"manual",issueId:base.issueId||"",mails:base.mails||[]}); await db.doc(k+"/"+did).set(data); }
    else await db.doc(k+"/"+did).update(data);
    const tids=await syncTrace(k,did,Object.assign({},base,data));
    if(tids.length) await db.doc(k+"/"+did).update({traceIds:tids});
    msg.className="msg ok"; msg.textContent="저장했어요"+(tids.length?` · 추적 대장 ${tids.length}건 갱신`:"");
    dcur.id=did; dcur.isNew=false; dcur.base=Object.assign({},base,data);
  }catch(err){ msg.className="msg err"; msg.textContent="저장하지 못했어요: "+(err.code||"오류"); }
  finally{ $("#fSave").disabled=false; }
});

  const prompt=`당신은 의료용 X-ray 장비 제조사 (주)레이 품질검사팀의 품질 엔지니어입니다. 아래 ${DEF[k].name} 건의 원인과 대책 초안을 씁니다.
규칙: 한국어, 짧고 구체적으로. 확인되지 않은 것은 "[추정]"을 붙이고, 확인할 방법을 함께 적으세요. 원인은 직접 원인과 유출 원인(왜 검사에서 못 걸렀나)을 나눠 쓰세요. 영구 대책에는 반드시 추적성(S/N·LOT 기록) 관점 1개를 포함하세요. 지어낸 수치나 날짜는 쓰지 마세요.

불량 정보:
${DEF[k].fields.filter(f=>f[0]!=="#"&&has(x[f[0]])).map(f=>`${f[1].replace(" *","")}: ${x[f[0]]}`).join("\n")}

  $("#fGen").disabled=true; msg.className="msg"; msg.textContent="쓰는 중…";
  try{
    const r=await sample(prompt); const m=String(r.text).match(/\{[\s\S]*\}/); const o=JSON.parse(m?m[0]:r.text);

document.addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-key]"); if(tr&&!e.target.closest("button")){ S.tsel=tr.dataset.key; render(); return; }
  const dr=e.target.closest("[data-def]"); if(dr){ const k=dr.dataset.kind; const x=S[k].find(y=>y.id===dr.dataset.def); if(x) openDef(k,x,false); return; }
  const ds=e.target.closest("[data-dstat]"); if(ds){ S.dstat=ds.dataset.dstat; render(); return; }
  const t=e.target.closest("button,[data-open],a[data-act]"); if(!t) return;
  if(t.tagName==="A") e.preventDefault();

  if(t.dataset.fmode){ S.fmode=t.dataset.fmode; render(); return; }

/* ---------- actions ---------- */
const byId = id => S.issues.find(i=>i.id===id);
async function patch(path,data){ if(!db){ toast("저장할 수 없어요. 로그인 상태를 확인해 주세요."); return false; } try{ await db.doc(path).update(data); return true; }catch(err){ toast("저장하지 못했어요: "+(err.code||"오류")); return false; } }
function mcpMsg(err){ const c=err&&err.code; return ({needs_reauth:"Microsoft 365 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.",server_not_connected:"Microsoft 365 커넥터가 연결돼 있지 않아요. claude.ai 설정 → 커넥터에서 추가해 주세요.",not_in_manifest:"이 페이지에서 Microsoft 365 사용을 허용하지 않았어요. 페이지 권한에서 켜 주세요.",approval_required:"승인이 필요해요. 버튼을 다시 눌러 허용해 주세요.",blocked_by_policy:"회사 정책으로 막혀 있어요.",tool_error:"Outlook이 요청을 거절했어요: "+(err.message||"")}[c]) || ("Outlook 연결 오류("+(c||"알 수 없음")+"). 잠시 후 다시 시도해 주세요. 이미 만들어졌을 수 있으니 Outlook에서 먼저 확인해 주세요."); }

let cur=null;
async function handle(act,t){
  const id=t.dataset.id;
  if(act==="close"||act==="reopen"){ if(await patch("issues/"+id,{status:act==="close"?"closed":"open"})) toast(act==="close"?"완료로 옮겼어요":"다시 열었어요"); return; }
  if(act==="lv"){ await patch("issues/"+id,{level:t.dataset.lv}); return; }
  // 품질회의: 종결/다시 열기, 우리 팀 요청 완료/대기 — 손으로 바꾼 것은 메일 정리가 덮어쓰지 않는다(stageManual, doneManual).
  if(act==="qclose"){ const a=S.qm.find(x=>x.id===id); if(!a) return; const close=a.stage!=="종결";
    const stage = close ? "종결" : (a.stageBefore && a.stageBefore!=="종결" ? a.stageBefore : "대책");
    if(await patch("qmeet/"+id,{stage, stageManual:true, stageBefore: close ? (a.stage||"상정") : "", closedAt: close?new Date().toISOString().slice(0,10):""})) toast(close?"종결로 옮겼어요":"다시 열었어요"); return; }
  if(act==="qask"){ const a=S.qm.find(x=>x.id===id); if(!a) return; const j=Number(t.dataset.i);
    const list=(a.asksMine||[]).map((x,k)=>k===j?{...x,done:!x.done,doneManual:true,doneAt:!x.done?new Date().toISOString().slice(0,10):""}:x);
    if(await patch("qmeet/"+id,{asksMine:list})) toast(list[j].done?"완료로 표시했어요":"대기로 되돌렸어요"); return; }
  if(act==="goto"){ openIssue(id); return; }
  if(act==="defnew"){ const k=t.dataset.kind; const i=id&&byId(id); const x={date:new Date().toISOString().slice(0,10),status:"new"};
    if(i){ x.issueId=i.id; x[k==="iqc"?"defect":"symptom"]=i.summary||i.title; x.mails=(i.mails||[]).slice(-5).map(m=>({mid:m.mid,from:m.from,at:m.at,subject:m.subject})); }
    openDef(k,x,true); return; }
  if(act==="trace"){ S.tsel=id; S.q=""; $("#q").value=""; location.hash="trace"; S.view="trace"; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act==="tclose"){ const x=tById(id); await patch("trace/"+id,{status:x.status==="closed"?"open":"closed"}); return; }
  if(act==="mv"){ const a=S.asks.find(x=>x.id===id); const k=STAGES.findIndex(s=>s[0]===(a.stage||"requested"))+Number(t.dataset.d); if(k>=0&&k<4) await patch("asks/"+id,{stage:STAGES[k][0], movedAt:new Date().toISOString()}); return; }
  if(act==="draft"){ const i=byId(id); cur={kind:"issue",item:i}; openDraft(i.title,(i.mails||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))), i.replyTo); return; }
  if(act==="remind"){ const a=S.asks.find(x=>x.id===id); cur={kind:"ask",item:a}; openDraft("리마인드: "+a.what,[{mid:a.mid,from:a.to,subject:a.what,at:a.askedAt}],a.mid); $("#dIntent").value=`${a.to}님께 "${a.what}" 진행 상황을 정중하게 다시 여쭤보는 리마인드`; return; }
  if(act==="event"){ const i=byId(id); cur={item:i}; $("#eSub").value=i.title; $("#eDate").value=i.due||new Date(Date.now()+864e5).toISOString().slice(0,10); $("#eBody").value=[i.nextAction,i.summary].filter(Boolean).join("\n\n"); $("#eMsg").textContent=""; $("#eSave").disabled=!mcp; if(!mcp) $("#eMsg").textContent="이 화면에서는 Outlook에 연결할 수 없어요."; $("#dlgEvent").showModal(); return; }
  if(act==="ask"){ const i=byId(id); cur={item:i}; $("#aWhat").value=i.nextAction||i.title; $("#aTo").value=(i.people||[])[0]||""; $("#aDue").value=i.due||""; $("#aMsg").textContent=""; $("#dlgAsk").showModal(); return; }
}

function openDraft(title,mails,pref){
  $("#dTitle").textContent="답장 초안 · "+title;
  $("#dMail").innerHTML=mails.filter(m=>m.mid).map(m=>`<option value="${esc(m.mid)}" ${m.mid===pref?"selected":""}>${esc(fmt(m.at))} ${esc(m.from)} — ${esc(m.subject||m.gist||"")}</option>`).join("");
  $("#dIntent").value=""; $("#dBody").value=""; $("#dMsg").textContent=""; $("#dGenMsg").textContent="";
  $("#dGen").disabled=!sample; if(!sample) $("#dGenMsg").textContent="이 화면에서는 Claude 초안 쓰기를 쓸 수 없어요. 직접 입력해 주세요.";
  $("#dSave").disabled=!mcp; if(!mcp) $("#dMsg").textContent="이 화면에서는 Outlook에 저장할 수 없어요.";
  $("#dlgDraft").showModal();
}
$("#dGen").addEventListener("click",async()=>{
  const it=cur.item; const msg=$("#dGenMsg"); msg.className="msg"; msg.textContent="쓰는 중…"; $("#dGen").disabled=true;
  const ctx = cur.kind==="ask" ? `부탁 내용: ${it.what}\n받는 사람: ${it.to}\n부탁한 날: ${it.askedAt}\n기한: ${it.due||"없음"}` :
    `이슈: ${it.title}\n요약: ${it.summary||""}\n내 할 일: ${it.nextAction||""}\n메일 흐름:\n`+(it.mails||[]).map(m=>`- ${m.at} ${m.from}: ${m.gist||m.subject}`).join("\n");
  const prompt=`당신은 (주)레이 품질 조직 김원수 수석의 메일 비서입니다. 아래 맥락으로 한국어 업무 답장 본문만 작성하세요. 인사 한 줄, 핵심 2~4문장, 마무리 한 줄. 서명은 "김원수 드림". 확인되지 않은 사실이나 날짜는 지어내지 말고 [확인 필요]로 표시하세요. 본문 외 다른 말은 쓰지 마세요.\n\n요청 방향: ${$("#dIntent").value||"맥락에 맞게 회신"}\n\n${ctx}`;
  try{ const r=await sample(prompt,{onText:({text})=>{$("#dBody").value=text;}}); $("#dBody").value=r.text; msg.textContent="초안을 썼어요. 고친 뒤 저장하세요."; msg.className="msg ok"; }
  catch(err){ msg.className="msg err"; msg.textContent= err.code==="not_granted"?"Claude 사용이 허용되지 않았어요. 직접 입력해 주세요.":err.code==="rate_limited"?"요청이 많아요. 잠시 후 다시 눌러 주세요.":"초안을 쓰지 못했어요. 직접 입력해 주세요."; }
  finally{ $("#dGen").disabled=false; }
});
$("#dSave").addEventListener("click",async()=>{
  const mid=$("#dMail").value, body=$("#dBody").value.trim(), msg=$("#dMsg");
  if(!mid){ msg.className="msg err"; msg.textContent="답장할 메일을 고르세요."; return; }
  if(!body){ msg.className="msg err"; msg.textContent="본문을 입력하세요."; return; }
  const html=body.split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");
  $("#dSave").disabled=true; msg.className="msg"; msg.textContent="저장하는 중…";
  try{ const r=await mcp.callTool("Microsoft 365","outlook_create_reply_draft",{messageId:mid,body:html,bodyType:"html"}); const p=r.payload||{}; const link=p.webLink||(p.draft&&p.draft.webLink);
    msg.className="msg ok"; msg.innerHTML="임시보관함에 저장했어요."+(link?` <a href="${esc(link)}" target="_blank" rel="noopener">Outlook에서 열기</a>`:"");
    if(cur.kind==="ask") patch("asks/"+cur.item.id,{lastNote:"리마인드 초안 작성 "+fmt(new Date().toISOString())});
  }catch(err){ msg.className="msg err"; msg.textContent=mcpMsg(err); }
  finally{ $("#dSave").disabled=false; }
});
$("#eSave").addEventListener("click",async()=>{
  const d=$("#eDate").value, s=$("#eStart").value, e=$("#eEnd").value, msg=$("#eMsg");
  if(!d||!s||!e||e<=s){ msg.className="msg err"; msg.textContent="날짜와 시간을 확인하세요. 끝이 시작보다 늦어야 해요."; return; }
  $("#eSave").disabled=true; msg.className="msg"; msg.textContent="만드는 중…";
  try{ const r=await mcp.callTool("Microsoft 365","outlook_create_event",{subject:$("#eSub").value||cur.item.title,start:{dateTime:d+"T"+s,timeZone:"Asia/Seoul"},end:{dateTime:d+"T"+e,timeZone:"Asia/Seoul"},body:$("#eBody").value,bodyType:"text",showAs:"busy"});
    const link=(r.payload||{}).webLink; msg.className="msg ok"; msg.innerHTML="일정을 만들었어요."+(link?` <a href="${esc(link)}" target="_blank" rel="noopener">Outlook에서 열기</a>`:""); }
  catch(err){ msg.className="msg err"; msg.textContent=mcpMsg(err); $("#eSave").disabled=false; }
});
$("#aSave").addEventListener("click",async()=>{
  const what=$("#aWhat").value.trim(), to=$("#aTo").value.trim(), msg=$("#aMsg");
  if(!what||!to){ msg.className="msg err"; msg.textContent="무엇을, 누구에게를 채워 주세요."; return; }
  if(!db){ msg.className="msg err"; msg.textContent="저장할 수 없어요. 로그인 상태를 확인해 주세요."; return; }
  const i=cur.item; const last=(i.mails||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];
  try{ await db.collection("asks").add({what,to,due:$("#aDue").value,stage:"requested",askedAt:new Date().toISOString(),issueId:i.id,mid:last?last.mid:"",source:"manual"}); $("#dlgAsk").close(); toast("부탁 목록에 추가했어요"); }
  catch(err){ msg.className="msg err"; msg.textContent="추가하지 못했어요: "+(err.code||"오류"); }
});

/* ---------- data ---------- */
async function loadWeb(){
  try{ const r=await fetch(WEB,{cache:"no-store"}); if(!r.ok) throw new Error(String(r.status)); const d=await r.json();
    S.issues=d.issues||[]; S.asks=d.asks||[]; S.trace=d.trace||[]; S.iqc=d.iqc||[]; S.field=d.field||[]; S.meta=d.meta||null; S.exportedAt=d.exportedAt||""; setY(d.ylink||{}); setQm(d.qmeet||[]);
    S.briefs=(d.briefs||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,30);
    S.loadErr=false;
  }catch(e){ S.loadErr=true; }
  S.loaded=true; render();
}
$("#refreshBtn").addEventListener("click", async ()=>{
  const b=$("#refreshBtn"); if(b.disabled) return;
  if(!WEB){ location.reload(); return; }
  b.disabled=true; b.style.opacity=".5";
  await loadWeb();
  b.disabled=false; b.style.opacity="";
  toast(S.loadErr?"불러오지 못했어요":"최신 내용으로 바꿨어요");
});
async function boot(){
  route();
  if(WEB){
    document.documentElement.classList.add("web"); $("#homeLink").hidden=false;
    await loadWeb(); return;
  }
  const timer=setTimeout(()=>{ if(!S.loaded){ S.loaded=true; render(); $("#stamp").textContent="데이터에 아직 연결되지 않았어요"; } },10000);
  try{ db = await window.claude?.use("db"); }catch(_){ db=null; }
  if(!db){ clearTimeout(timer); S.loaded=true; render(); }
  else {
    const done=()=>{ clearTimeout(timer); S.loaded=true; };
    const err=e=>{ done(); render(); if(e&&e.code!=="revoked") $("#stamp").textContent="데이터를 불러오지 못했어요 ("+e.code+")"; };
    const conv=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    db.collection("issues").onSnapshot(s=>{ S.issues=conv(s); if(!s.metadata.fromCache) done(); render(); },err);
    db.collection("asks").onSnapshot(s=>{ S.asks=conv(s); render(); },err);
    db.collection("trace").onSnapshot(s=>{ S.trace=conv(s); render(); },err);
    db.collection("iqc").onSnapshot(s=>{ S.iqc=conv(s); render(); },err);
    db.collection("field").onSnapshot(s=>{ S.field=conv(s); render(); },err);
    db.collection("briefs").orderBy("at","desc").limit(30).onSnapshot(s=>{ S.briefs=conv(s); render(); },err);
    db.collection("qmeet").onSnapshot(s=>{ setQm(conv(s)); render(); },()=>{});
    db.collection("ylink").onSnapshot(s=>{ const o={}; s.docs.forEach(d=>{ o[d.id]=d.data(); }); setY(o); render(); },()=>{});
    db.doc("meta/state").onSnapshot(s=>{ S.meta=s.exists?s.data():null; render(); },err);
  }
  window.claude?.use("mcp").then(m=>{ mcp=m; }).catch(()=>{});
  window.claude?.use("sample").then(s=>{ sample=s; }).catch(()=>{});
}
boot();
})();
</script>
